      k.add([ig, name, desc]);
      const bh = Math.min(38 * D, cardH * 0.15);
      if (o.sold) {
        k.add(this.add.text(x + cardW / 2, cy0 + cardH - bh * 0.8, 'Alındı ✓', { fontFamily: FONT, fontSize: fs + 'px', fontStyle: '700', color: '#7fe3a5' }).setOrigin(0.5));
      } else {
        const can = state.res.money >= it.cost;
        const b = makeButton(this, x + cardW / 2, cy0 + cardH - bh * 0.8, cardW - 16 * D, bh, `${it.cost} ●`, can ? BTN_GO : { base: 0x3a4466, dark: 0x252d47, text: '#8e97b8' }, () => this.buy(n));
        k.add(b);
      }
    });
    const by = cy0 + cardH + 34 * D, bw = (cw - gap) / 2, bh = Math.min(48 * D, H * 0.065);
    const rc = RULES.rerollCost + (state.rerolls || 0);
    const rb = makeButton(this, pad + bw / 2, by, bw, bh, `↻ Yenile ${rc}●`, { base: 0x8fb4ff, dark: 0x3e62b0, text: '#0d1a33' }, () => this.reroll());
    rb.setAlpha(state.res.money >= rc ? 1 : 0.5);
    const cb = makeButton(this, W - pad - bw / 2, by, bw, bh, 'Devam  ▶', BTN_BRASS, () => this.closeShop());
    const inv = this.add.text(W / 2, by + bh * 0.9, 'Modülü aldıktan sonra takacağın makineye dokun.', { fontFamily: FONT, fontSize: Math.round(fs * 0.9) + 'px', fontStyle: '500', color: C.dim, align: 'center', wordWrap: { width: cw } }).setOrigin(0.5, 0);
    k.add([rb, cb, inv]);
    this.shop = k;
    this.banner.setVisible(false);
  }
  closeShop() {
    if (this.shop) { this.shop.destroy(); this.shop = null; }
    state.shopOpen = false;
    sfx.pick();
    this.refreshPhase();
  }
  reroll() {
    const rc = RULES.rerollCost + (state.rerolls || 0);
    if (state.res.money < rc) { this.cameras.main.shake(80, 0.004); sfx.bad(); return; }
    state.res.money -= rc; state.rerolls = (state.rerolls || 0) + 1;
    this.rollOffers(); sfx.tap();
    this.openShop();
  }
  buy(n) {
    const o = state.offers[n], it = SHOP[o.key];
    if (o.sold) return;
    if (state.res.money < it.cost) { this.cameras.main.shake(80, 0.004); sfx.bad(); return; }
    state.res.money -= it.cost; o.sold = true;
    [660, 880].forEach((f, k) => setTimeout(() => beep(f, 0.08, 'triangle', 0.15), k * 70)); buzz(20);
    if (o.key === 'place') { state.places += 1; this.openShop(); }
    else if (o.key === 'ice') {
      state.heat = state.heat.map(() => 0);
      this.cells.forEach((v, i) => { if (v) { const c = this.cellCenter(i); this.sparks.explode(6, c.x, c.y); } });
      this.openShop();
    } else {
      // modül: dükkanı kapat, makine seçtir
      if (this.shop) { this.shop.destroy(); this.shop = null; }
      this.pickMod = o.key;
      this.setBanner(`${it.name}: bir makineye dokun`, it.desc, it.color);
      this.infoUntil = this.time.now + 1e9;
    }
    this.updateHud(true);
  }
  attachMod(i) {
    const key = this.pickMod, it = SHOP[key];
    state.mod[i] = key;
    this.pickMod = null; this.infoUntil = 0;
    const c = this.cellCenter(i);
    this.sparks.explode(18, c.x, c.y); sfx.place();
    const v = this.cells[i];
    this.tweens.add({ targets: v, scale: 1.12, duration: 90, yoyo: true });
    this.flashTip(`${it.name} takıldı`, key === 'ring' ? 'Turuncu karelerdeki komşular daha hızlı çalışır ama daha çok ısınır.' : 'Bu makine artık daha yavaş ısınır.', it.color, 2500);
    this.time.delayedCall(700, () => { if (state.phase === 'build' && state.shopOpen) this.openShop(); });
  }
  drawMods(g) {
    // modül rozetleri (sol üst köşe) ve Halka etki alanı
    const s = this.cell;
    state.grid.forEach((t, i) => {
      const m = t && state.mod[i]; if (!m || !this.cells[i]) return;
      const c = this.cellCenter(i);
      if (m === 'ring' && state.phase === 'build') {
        for (let d = 0; d < 4; d++) {
          const j = this.nb(i, d); if (j < 0) continue;
          const x = this.gx + (j % COLS) * s, y = this.gy + Math.floor(j / COLS) * s, gap = Math.max(2, s * 0.04);
          this.linkG.fillStyle(0xffa040, 0.13).fillRoundedRect(x + gap, y + gap, s - gap * 2, s - gap * 2, s * 0.14);
        }
      }
      g.fillStyle(0x0b0f1c, 0.92).fillCircle(c.x - s * 0.34, c.y - s * 0.34, s * 0.16);
      this.drawShopIcon(g, m, c.x - s * 0.34, c.y - s * 0.34, s * 0.125);
    });
  }

  // ---------- açıklama kartı ----------
  setBanner(title, body, accent) {
    const { w, h } = this.bannerSize, g = this.bannerG;
    g.clear();
    g.fillStyle(0x000000, 0.35).fillRoundedRect(0, 4 * D, w, h, 16 * D);
    g.fillStyle(0x232c4a, 0.97).fillRoundedRect(0, 0, w, h, 16 * D);
    g.lineStyle(2 * D, accent || C.brass, 1).strokeRoundedRect(0, 0, w, h, 16 * D);
    this.bannerT1.setText(title);
    this.bannerT2.setText(body);
    this.banner.setVisible(true);
  }
  showInfo(type) {
    const m = MACHINES[type], info = INFO[type];
    this.setBanner(info.title + '   ' + info.recipe, info.body, m.color);
    this.infoUntil = this.time.now + 2800;
  }
  tutorial() {
    // ilk turda adım adım yol göster
    this.slots.forEach(s => s.ring.setVisible(false));
    this.goRing.setVisible(false);
    if (this.dialog) return;
    if (this.infoUntil && this.time.now < this.infoUntil) return;
    if (state.round !== 0 || state.tutorialDone) {
      this.banner.setVisible(false);
      return;
    }
    const has = t => state.grid.includes(t);
    if (state.phase === 'build') {
      const presses = state.grid.map((t, i) => t === 'press' ? i : -1).filter(i => i >= 0);
      if (!has('crank')) {
        this.setBanner('1 / 3   Önce bir Krank koy', 'Krank enerji ⚡ üretir ama sadece mavi oklarının gösterdiği 2 komşuya verir.', MACHINES.crank.color);
        this.slots[0].ring.setVisible(true);
      } else if (!presses.length) {
        this.setBanner('2 / 3   Pres\'i Krank\'ın okunun önüne koy', 'Mavi okun gösterdiği kareye konan Pres enerji alır. Makineye dokunursan döner.', MACHINES.press.color);
        this.slots[1].ring.setVisible(true);
      } else if (!presses.some(i => this.suppliers(i).length)) {
        this.setBanner('⚠ Pres enerji alamıyor!', 'Kırmızı çerçeve: enerji yok. Krank\'a dokunup döndür ya da Pres\'i mavi okun önüne taşı.', 0xe0564a);
      } else if (presses.every(i => this.outputBlocked(i))) {
        this.setBanner('⚠ Pres\'in çıkışı kapalı!', 'Sarı ok boş bir kareyi göstermeli; kıvılcım oradan çıkar. Pres\'e dokunup döndür.', 0xe0564a);
      } else {
        this.setBanner('3 / 3   Hazırsın! ▶ Başlat\'a bas', 'Mavi çizgi = enerji bağlantısı. 60 saniyede ✦ 30 topla.', 0x5fd38a);
        this.goRing.setVisible(true);
      }
    } else if (state.phase === 'run') {
      if (state.time > RULES.roundTime - 9) {
        this.setBanner('Makineler çalıştıkça ısınır', 'Alttaki çubuk ısıyı gösterir. Dolunca ! çıkar: dokun, mini oyunla soğut. Tamamen ısınan makine durur.', 0xffc23d);
      } else {
        this.banner.setVisible(false);
        state.tutorialDone = true;
      }
    }
  }

  // ---------- tur akışı ----------
  canFinish() { return state.phase === 'run' && state.res.spark >= RULES.goals[state.round]; }
  earlyBonus() { return Math.floor(Math.max(0, state.time) / RULES.bonusEvery); }
  finishEarly() {
    if (!this.canFinish()) return;
    const bonus = this.earlyBonus();
    state.res.money += bonus;
    this.endRound(bonus);
  }

  startRound() {
    if (state.phase !== 'build') return;
    if (this.pickMod) { this.cameras.main.shake(80, 0.004); sfx.bad(); return; }
    state.shopOpen = false;
    if (!state.grid.some(Boolean)) { this.cameras.main.shake(80, 0.004); sfx.bad(); return; }
    state.phase = 'run';
    state.time = RULES.roundTime;
    state.res.spark = 0;
    state.res.energy = 0;
    state.buf.fill(0);
    state.boomT = RULES.boomDelay;
    // her makine biraz farklı ısınır, böylece uyarılar aynı anda gelmez
    this.cells.forEach((v, i) => {
      if (!v) return;
      v.t = 0; v.boost = null; v.stalled = false; v.svc = 'ok';
      v.rateJ = Phaser.Math.FloatBetween(0.8, 1.2);
      state.heat[i] = Math.max(state.heat[i] || 0, Phaser.Math.FloatBetween(0, 0.25));
    });
    beep(392, 0.12, 'triangle', 0.2); setTimeout(() => beep(523, 0.12, 'triangle', 0.2), 110); setTimeout(() => beep(784, 0.2, 'triangle', 0.2), 220);
    buzz(30);
    this.refreshPhase();
  }

  endRound(bonus = 0) {
    if (this.mg) { this.mg.panel.destroy(); this.mg = null; }
    this.countText.setVisible(false);
    this.cells.forEach(v => { if (v) { this.setAlert(v, null); v.setAlpha(1); v.svc = 'ok'; } });
    const goal = RULES.goals[state.round];
    const won = state.res.spark >= goal;
    const before = state.pressure;
    // tur arası: makineler biraz soğur; hedef tutmazsa eksik oranında ısınır
    const miss = won ? 0 : 1 - state.res.spark / goal;
    state.grid.forEach((t, i) => {
      if (!t) return;
      const h = state.heat[i] * RULES.carryHeat;
      state.heat[i] = Phaser.Math.Clamp(won ? h - RULES.winCool : h + miss * RULES.missHeat, 0, 1);
    });
    state.pressure = this.computePressure();
    const delta = Math.round(state.pressure - before);
    state.phase = 'end';
    state.result = { won, spark: state.res.spark, goal, bonus, delta, last: state.round === RULES.goals.length - 1 };
    if (state.pressure >= 100) { this.explode(); return; }
    this.refreshPhase();
    if (state.result.last) this.showDialog(STORY.win, () => this.showResult());
    else this.showResult();
    if (won) { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.14, 'triangle', 0.2), i * 100)); buzz([20, 40, 20]); }
    else { beep(220, 0.3, 'sawtooth', 0.15); setTimeout(() => beep(150, 0.4, 'sawtooth', 0.15), 200); buzz(120); }
  }

  // ---------- patlama ----------
  explode() {
    if (this.boomed) return;
    this.boomed = true;
    if (this.mg) { this.mg.panel.destroy(); this.mg = null; }
    state.phase = 'boom';
    state.pressure = 100;
    this.countText.setVisible(false);
    this.cells.forEach(v => { if (v) this.setAlert(v, null); });
    this.banner.setVisible(false); this.infoUntil = 0;
    state.result = Object.assign(state.result || {}, { boom: true, round: state.round });
    this.updateHud(true);
    this.refreshPhase();
    const W = this.W, H = this.H;
    // önce titreme ve siren, sonra BUM
    this.cells.forEach(v => { if (v) this.tweens.add({ targets: v, x: v.x + 3 * D, duration: 40, yoyo: true, repeat: 8 }); });
    [880, 660, 880, 660].forEach((f, k) => setTimeout(() => beep(f, 0.12, 'square', 0.12), k * 130));
    this.cameras.main.shake(600, 0.004);
    this.time.delayedCall(600, () => {
      boomSound(); buzz([200, 60, 300]);
      this.cameras.main.shake(700, 0.03);
      const flash = this.add.rectangle(0, 0, W, H, 0xfff2c4, 1).setOrigin(0).setDepth(95);
      this.tweens.add({ targets: flash, alpha: 0, duration: 500, onComplete: () => flash.destroy() });
      const cx = this.gx + this.cell * COLS / 2, cy = this.gy + this.cell * ROWS / 2;
      if (!this.textures.exists('smoke')) {
        const t = this.make.graphics({ add: false });
        t.fillStyle(0xffffff, 1).fillCircle(32, 32, 32);
        t.generateTexture('smoke', 64, 64); t.destroy();
      }
      const fire = this.add.particles(0, 0, 'spark', {
        speed: { min: 200 * D, max: 900 * D }, angle: { min: 0, max: 360 }, lifespan: 900,
        scale: { start: 1.4 * D, end: 0 }, tint: [0xffd84a, 0xff8a3c, 0xffffff, 0xe0564a], gravityY: 500 * D,
        blendMode: 'ADD', emitting: false,
      }).setDepth(92);
      const smoke = this.add.particles(0, 0, 'smoke', {
        speed: { min: 30 * D, max: 160 * D }, angle: { min: 0, max: 360 }, lifespan: 1800,
        scale: { start: 0.6 * D, end: 2.2 * D }, alpha: { start: 0.5, end: 0 }, tint: [0x3a3f52, 0x55596b, 0x2a2e3c],
        emitting: false,
      }).setDepth(91);
      fire.explode(120, cx, cy);
      this.cells.forEach((v, i) => {
        if (!v) return;
        fire.explode(14, v.x, v.y); smoke.explode(4, v.x, v.y);
        const a = Math.atan2(v.y - cy, v.x - cx) + Phaser.Math.FloatBetween(-0.5, 0.5);
        const dist = Phaser.Math.FloatBetween(0.6, 1.1) * Math.max(W, H);
        this.tweens.add({ targets: v, x: v.x + Math.cos(a) * dist, y: v.y + Math.sin(a) * dist - H * 0.2, angle: Phaser.Math.Between(-540, 540), scale: 1.4, duration: 1100, ease: 'Quad.easeOut' });
      });
      smoke.explode(18, cx, cy);
      this.gridG.setAlpha(0.5);
      this.time.delayedCall(1500, () => this.showDialog(STORY.boom, () => this.showResult()));
    });
  }

  showResult() {
    const W = this.W, H = this.H, R = state.result;
    const k = this.add.container(0, 0).setDepth(100);
    const dim = this.add.rectangle(0, 0, W, H, 0x05070d, 0.72).setOrigin(0).setInteractive();
    const cw = Math.min(W - this.pad * 2, 360 * D), ch = cw * 0.82;
    const cx = W / 2, cy = H * 0.45;
    const good = R.won && !R.boom;
    const g = this.add.graphics();
    g.fillStyle(C.copperDark, 1).fillRoundedRect(cx - cw / 2, cy - ch / 2 + 6 * D, cw, ch, 22 * D);
    g.fillStyle(0x1d2540, 1).fillRoundedRect(cx - cw / 2, cy - ch / 2, cw, ch, 22 * D);
    g.lineStyle(3 * D, good ? 0x5fd38a : R.boom ? 0xff8a3c : 0xe0564a, 1).strokeRoundedRect(cx - cw / 2, cy - ch / 2, cw, ch, 22 * D);
    let title, big, sub, label, style;
    if (R.boom) {
      title = 'FABRİKA PATLADI!';
      big = `Tur ${R.round + 1} / ${RULES.goals.length}`;
      sub = R.round === 0 ? 'Bir türün bütün makineleri kızınca basınç %100 olur.\nIsınanları mini oyunla soğut, Fan 2×2 alanı korur.' : `${R.round} tur dayandın. Bir dahakine daha uzun!`;
      label = 'Yeniden kur'; style = BTN_BRASS;
    } else if (R.last) {
      title = R.won ? 'Fabrika ayakta!' : 'Zor da olsa ayakta!';
      big = `✦ ${R.spark} / ${R.goal}`;
      sub = `Prototipin ${RULES.goals.length} turunu patlamadan bitirdin.\nSon basınç: %${Math.round(state.pressure)}`;
      label = 'Yeniden başla'; style = BTN_GO;
    } else {
      title = R.won ? 'Hedef tuttu!' : 'Hedef tutmadı';
      big = `✦ ${R.spark} / ${R.goal}`;
      const p = R.delta > 0 ? `Basınç +%${R.delta}  ▲` : R.delta < 0 ? `Basınç %${-R.delta} azaldı  ▼` : '';
      sub = (R.bonus ? `Erken bitirme bonusu: +${R.bonus} ●\n` : '') + (p ? p + '\n' : '') + `Sonraki hedef: ✦ ${RULES.goals[state.round + 1]}  ·  +${RULES.placesPerRound} hak`;
      label = 'Sonraki tur  ▶'; style = R.won ? BTN_GO : BTN_BRASS;
    }
    const t1 = this.add.text(cx, cy - ch * 0.32, title, { fontFamily: FONT, fontSize: Math.round(cw * (R.boom ? 0.088 : 0.1)) + 'px', fontStyle: '700', color: good ? '#7fe3a5' : R.boom ? '#ffb36b' : '#ff8a7c' }).setOrigin(0.5);
    const t2 = this.add.text(cx, cy - ch * 0.13, big, { fontFamily: FONT, fontSize: Math.round(cw * 0.08) + 'px', fontStyle: '700', color: '#ffd84a' }).setOrigin(0.5);
    const t3 = this.add.text(cx, cy + ch * 0.1, sub, { fontFamily: FONT, fontSize: Math.round(cw * 0.045) + 'px', fontStyle: '500', color: C.dim, align: 'center', lineSpacing: 4 * D }).setOrigin(0.5);
    const btn = makeButton(this, cx, cy + ch * 0.37, cw * 0.7, Math.min(ch * 0.19, 56 * D), label, style, () => this.afterResult());
    k.add([dim, g, t1, t2, t3, btn]);
    k.setAlpha(0); this.tweens.add({ targets: k, alpha: 1, duration: 200 });
    this.resultBox = k;
  }

  afterResult() {
    const R = state.result;
    if (!R.boom && !R.last) {
      state.round++;
      state.phase = 'build';
      state.places += RULES.placesPerRound;
      state.res.spark = 0;
      state.res.energy = 0;
      state.time = RULES.roundTime;
      state.result = null;
      this.resultBox.destroy();
      state.offers = null; state.rerolls = 0; state.shopOpen = true;
      this.refreshPhase();
      this.openShop();
      if (state.pressure >= 30 && !state.ventTaught) {
        state.ventTaught = true;
        this.flashTip('Fabrika sıcak mı? Soğut!', `Mavi ❄ Soğut düğmesi ${RULES.ventCost} ● karşılığında tüm makinelerin ısısını %${Math.round(RULES.ventCool * 100)} düşürür.`, 0x8fb4ff, 6000);
      }
    } else {
      newRun();
      this.boomed = false;
      this.scene.restart();
    }
  }

  drawDanger(dtMs) {
    const p = state.pressure, g = this.dangerG;
    g.clear();
    if (p < 65 || state.phase !== 'run') return;
    this.dangerT = (this.dangerT || 0) + dtMs * (p > 85 ? 0.012 : 0.007);
    const a = (0.25 + 0.25 * Math.sin(this.dangerT)) * ((p - 60) / 40);
    const w = 18 * D;
    g.fillStyle(0xe0564a, a);
    g.fillRect(0, 0, this.W, w); g.fillRect(0, this.H - w, this.W, w);
    g.fillRect(0, 0, w, this.H); g.fillRect(this.W - w, 0, w, this.H);
    const beat = Math.floor(this.dangerT / Math.PI);
    if (beat !== this.lastBeat) { this.lastBeat = beat; if (beat % 2 === 0) { beep(p > 85 ? 980 : 740, 0.08, 'square', 0.07); buzz(10); } }
  }

  // ---------- üretim ----------
  produce(i, v) {
    const p = PROD[v.type];
    if (!p.out) return false;
    const s = this.cell, c = this.cellCenter(i);
    let px = c.x, py = c.y - s * 0.3, dx = 0, dy = -1;
    if (v.type === 'crank') {
      // Krank enerjiyi kendinde biriktirir, oklarındaki makineler alır
      if (state.buf[i] >= RULES.bufMax) { v.stalled = 'full'; return false; }
      state.buf[i]++;
    } else {
      if (this.outputBlocked(i)) { v.stalled = 'blocked'; return false; }
      const sup = this.suppliers(i).filter(j => state.buf[j] > 0);
      if (!sup.length) { v.stalled = 'power'; return false; }
      sup.sort((a, b) => state.buf[b] - state.buf[a]);
      state.buf[sup[0]]--;
      this.flowEnergy(sup[0], i);
      state.res[p.out] += 1;
      [dx, dy] = DIRS[this.rotOf(i)];
      px = c.x + dx * s * 0.42; py = c.y + dy * s * 0.42;
    }
    v.stalled = false;
    const pop = this.add.text(px, py, `+1 ${RES[p.out].sym}`, {
      fontFamily: FONT, fontSize: Math.round(s * 0.2) + 'px', fontStyle: '700', color: RES[p.out].color,
      stroke: '#0b0f1c', strokeThickness: 4 * D,
    }).setOrigin(0.5).setDepth(60);
    this.tweens.add({ targets: pop, x: px + dx * s * 0.45, y: py + dy * s * 0.45, alpha: 0, duration: 650, ease: 'Quad.easeOut', onComplete: () => pop.destroy() });
    this.tweens.add({ targets: v, scaleY: 0.93, scaleX: 1.04, duration: 60, yoyo: true });
    if (p.out === 'spark') beep(980, 0.04, 'square', 0.05);
    return true;
  }

  // =====================================================================
  // YERLEŞİM: yönler, bağlantılar, Fan alanı
  // =====================================================================
  nb(i, d) {
    const c = i % COLS + DIRS[d][0], r = Math.floor(i / COLS) + DIRS[d][1];
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
    return r * COLS + c;
  }
  rotOf(i) { return state.rot[i] ?? DEFAULT_ROT[state.grid[i]] ?? 0; }
  crankPorts(i) { const r = this.rotOf(i); return [r, (r + 1) % 4]; }
  suppliers(i) {
    // bu makineye enerji veren Krank'lar: Krank'ın oku bu kareyi gösteriyor olmalı
    const out = [];
    for (let d = 0; d < 4; d++) {
      const j = this.nb(i, d);
      if (j < 0 || state.grid[j] !== 'crank') continue;
      const back = (d + 2) % 4;              // Krank'tan bu makineye yön
      if (this.crankPorts(j).includes(back)) out.push(j);
    }
    return out;
  }
  outputBlocked(i) { const n = this.nb(i, this.rotOf(i)); return n >= 0 && !!state.grid[n]; }
  fanArea(i) {
    const r = this.rotOf(i);
    const sx = (r === 0 || r === 3) ? 1 : -1, sy = (r === 0 || r === 1) ? 1 : -1;
    const c0 = i % COLS, r0 = Math.floor(i / COLS), out = [];
    [[0, 0], [sx, 0], [0, sy], [sx, sy]].forEach(([dx, dy]) => {
      const c = c0 + dx, rr = r0 + dy;
      if (c >= 0 && c < COLS && rr >= 0 && rr < ROWS) out.push(rr * COLS + c);
    });
    return out;
  }
  cooled(i) {
    return state.grid.some((t, j) => t === 'fan' && j !== i && (state.heat[j] || 0) < 1 && this.fanArea(j).includes(i));
  }

  drawPorts(g, i) {
    // oklar makinelerin üstünde ayrı bir katmanda çizilir (komşu makine örtmesin)
    const s = this.cell, a = s * 0.11, o = this.cellCenter(i), type = state.grid[i];
    const arrow = (d, col) => {
      const [dx, dy] = DIRS[d], px = -dy, py = dx;
      const cx = o.x + dx * s * 0.42, cy = o.y + dy * s * 0.42;
      g.fillStyle(0x0b0f1c, 0.9).fillTriangle(cx + dx * a * 1.25, cy + dy * a * 1.25, cx - dx * a * 0.55 + px * a * 1.05, cy - dy * a * 0.55 + py * a * 1.05, cx - dx * a * 0.55 - px * a * 1.05, cy - dy * a * 0.55 - py * a * 1.05);
      g.fillStyle(col, 1).fillTriangle(cx + dx * a, cy + dy * a, cx - dx * a * 0.4 + px * a * 0.8, cy - dy * a * 0.4 + py * a * 0.8, cx - dx * a * 0.4 - px * a * 0.8, cy - dy * a * 0.4 - py * a * 0.8);
    };
    if (type === 'crank') this.crankPorts(i).forEach(d => arrow(d, 0x4fd6e0));
    else if (type === 'press') arrow(this.rotOf(i), 0xffd84a);
    else if (type === 'mint') arrow(this.rotOf(i), 0x7fd47a);
    else if (type === 'fan') {
      const r = this.rotOf(i);
      const sx = (r === 0 || r === 3) ? 1 : -1, sy = (r === 0 || r === 1) ? 1 : -1;
      const cx = o.x + sx * s * 0.42, cy = o.y + sy * s * 0.42;
      g.lineStyle(s * 0.06, 0x0b0f1c, 0.9).strokeCircle(cx, cy, s * 0.1);
      g.fillStyle(0x8fb4ff, 1).fillCircle(cx, cy, s * 0.08);
      g.fillStyle(0xffffff, 0.7).fillCircle(cx - s * 0.02, cy - s * 0.02, s * 0.03);
    }
  }

  drawHeat(v, i) {
    const g = v.heatG; if (!g) return;
    const h = state.heat[i] || 0, s = this.cell;
    const w = s * 0.6, bh = s * 0.075, x = -w / 2, y = s * 0.29;
    g.clear();
    g.fillStyle(0x0b0f1c, 0.95).fillRoundedRect(x - 2 * D, y - 2 * D, w + 4 * D, bh + 4 * D, (bh + 4 * D) / 2);
    if (h > 0.01) {
      let col = h < 0.5 ? 0x5fd38a : h < RULES.needAt ? 0xffc23d : h < 1 ? 0xff8a3c : 0xe0564a;
      if (h >= 1 && Math.floor(this.time.now / 200) % 2) col = 0xffffff;
      g.fillStyle(col, 1).fillRoundedRect(x, y, Math.max(bh, w * h), bh, bh / 2);
    }
    // ! eşiği çizgisi
    g.fillStyle(0xffffff, 0.35).fillRect(x + w * RULES.needAt - 1 * D, y - 1 * D, 2 * D, bh + 2 * D);
  }

  // inşa ve üretim sırasında bağlantıları göster
  drawLinks() {
    const g = this.linkG; g.clear();
    this.portL.clear();
    if (state.phase !== 'build' && state.phase !== 'run') return;
    state.grid.forEach((t, i) => { if (t && this.cells[i]) this.drawPorts(this.portL, i); });
    this.drawMods(this.portL);
    const s = this.cell, gap = Math.max(2, s * 0.04);
    const cellRect = (j) => ({ x: this.gx + (j % COLS) * s, y: this.gy + Math.floor(j / COLS) * s });
    state.grid.forEach((t, i) => {
      if (!t) return;
      if (t === 'fan' && state.phase === 'build') {
        this.fanArea(i).forEach(j => { const r = cellRect(j); g.fillStyle(0x8fb4ff, 0.12).fillRoundedRect(r.x + gap, r.y + gap, s - gap * 2, s - gap * 2, s * 0.14); });
      }
      if (t === 'press' || t === 'mint') {
        const sup = this.suppliers(i);
        sup.forEach(j => {
          const a = this.cellCenter(i), b = this.cellCenter(j);
          g.lineStyle(s * 0.09, 0x4fd6e0, 0.25).lineBetween(a.x, a.y, b.x, b.y);
          g.lineStyle(s * 0.035, 0x4fd6e0, 0.9).lineBetween(a.x, a.y, b.x, b.y);
        });
        const r = cellRect(i);
        if (!sup.length) {
          g.lineStyle(3 * D, 0xe0564a, state.phase === 'build' ? 0.9 : 0.5).strokeRoundedRect(r.x + gap, r.y + gap, s - gap * 2, s - gap * 2, s * 0.14);
        }
        if (this.outputBlocked(i)) {
          const [dx, dy] = DIRS[this.rotOf(i)], c = this.cellCenter(i);
          const x = c.x + dx * s * 0.5, y = c.y + dy * s * 0.5, k = s * 0.09;
          g.lineStyle(4 * D, 0xe0564a, 1).lineBetween(x - k, y - k, x + k, y + k).lineBetween(x - k, y + k, x + k, y - k);
        }
      }
    });
  }

  // =====================================================================
  // ISI VE BASINÇ
  // =====================================================================
  tickHeat(dt) {
    if (this.mg || this.dialog) return;
    this.cells.forEach((v, i) => {
      if (!v) return;
      let h = state.heat[i] || 0;
      if (h < 1) {
        let rate = RULES.heatRate[v.type] * (v.rateJ || 1);
        if (v.stalled) rate *= RULES.idleHeat;
        if (v.type !== 'fan' && this.cooled(i)) rate *= RULES.fanCool;
        if (v.boost && state.time > v.boost.until) rate *= 1.25;
        if (this.hasRingNear(i)) rate *= RULES.ringHeat;
        if (state.mod[i] === 'plate') rate *= RULES.plateHeat;
        h = Math.min(1, h + rate * dt);
        state.heat[i] = h;
      }
      const svc = h >= 1 ? 'broken' : h >= RULES.needAt ? 'need' : 'ok';
      if (svc !== v.svc) {
        v.svc = svc;
        this.setAlert(v, svc === 'ok' ? null : svc);
        if (svc === 'need') {
          beep(660, 0.06, 'triangle', 0.12); setTimeout(() => beep(660, 0.06, 'triangle', 0.12), 120); buzz(15);
          if (!state.serviceTaught) this.flashTip('Makine ısınıyor!', 'Isı çubuğu dolunca ! çıkar. Makineye dokun, mini oyunla soğut. Tamamen ısınırsa durur.', 0xffc23d, 5000, () => { state.serviceTaught = true; });
        } else if (svc === 'broken') {
          beep(120, 0.25, 'sawtooth', 0.12); buzz(60); this.cameras.main.shake(100, 0.003);
        }
      }
    });
  }

  computePressure() {
    // Basınç = en sıcak makine türünün ortalaması ağırlıklı; bir türün hepsi kızarsa %100
    const byType = {};
    let sum = 0, n = 0;
    state.grid.forEach((t, i) => { if (!t) return; const h = state.heat[i] || 0; (byType[t] = byType[t] || []).push(h); sum += h; n++; });
    if (!n) return 0;
    let M = 0, full = false;
    Object.values(byType).forEach(a => { const avg = a.reduce((x, y) => x + y, 0) / a.length; M = Math.max(M, avg); if (a.every(h => h >= 1)) full = true; });
    if (full) return 100;
    const raw = 0.6 * M + 0.4 * (sum / n);
    return Math.min(99, 100 * Math.pow(raw, 0.8));
  }

  tickPressure(dt) {
    state.pressure = this.computePressure();
    if (state.pressure >= 100 && !this.dialog) {
      if (!state.pressureTaught) { state.pressureTaught = true; }
      if (!this.mg) state.boomT = (state.boomT ?? RULES.boomDelay) - dt;
      const n = Math.max(1, Math.ceil(state.boomT));
      if (n !== this.lastCount) { this.lastCount = n; beep(1100, 0.12, 'square', 0.15); buzz(40); }
      this.countText.setText(`⚠ ${n}`).setVisible(true).setScale(1 + (state.boomT % 1) * 0.3);
      if (state.boomT <= 0) { this.countText.setVisible(false); this.explode(); }
    } else {
      state.boomT = RULES.boomDelay; this.lastCount = null;
      this.countText.setVisible(false);
    }
  }

  // =====================================================================
  // HİKÂYE: Nuri Usta konuşmaları
  // =====================================================================
  drawOwner(g, x, y, s) {
    // önlük
    g.fillStyle(0x6e3518, 1).fillRoundedRect(x - s * 0.55, y + s * 0.45, s * 1.1, s * 0.8, s * 0.3);
    g.fillStyle(0xcf7a3e, 1).fillRoundedRect(x - s * 0.35, y + s * 0.55, s * 0.7, s * 0.7, s * 0.12);
    g.fillStyle(0xe0b450, 1).fillCircle(x - s * 0.22, y + s * 0.66, s * 0.05).fillCircle(x + s * 0.22, y + s * 0.66, s * 0.05);
    // baş
    g.fillStyle(0xd9a37c, 1).fillCircle(x, y + s * 0.05, s * 0.46);
    g.fillStyle(0xf2c39b, 1).fillCircle(x, y, s * 0.45);
    g.fillStyle(0xe99a86, 0.6).fillCircle(x - s * 0.26, y + s * 0.1, s * 0.09).fillCircle(x + s * 0.26, y + s * 0.1, s * 0.09);
    // kasket
    g.fillStyle(0x3a2a22, 1).fillEllipse(x, y - s * 0.3, s * 1.0, s * 0.42);
    g.fillStyle(0x2a1d17, 1).fillEllipse(x + s * 0.18, y - s * 0.18, s * 0.75, s * 0.16);
    // gözler, kaşlar, bıyık
    g.fillStyle(0x2a1d17, 1).fillCircle(x - s * 0.15, y - s * 0.02, s * 0.045).fillCircle(x + s * 0.15, y - s * 0.02, s * 0.045);
    g.fillRect(x - s * 0.24, y - s * 0.13, s * 0.16, s * 0.035).fillRect(x + s * 0.08, y - s * 0.13, s * 0.16, s * 0.035);
    g.fillStyle(0x5a4a42, 1).fillEllipse(x - s * 0.12, y + s * 0.16, s * 0.28, s * 0.12).fillEllipse(x + s * 0.12, y + s * 0.16, s * 0.28, s * 0.12);
    g.fillStyle(0xb5645a, 1).fillEllipse(x, y + s * 0.26, s * 0.14, s * 0.06);
  }

  showDialog(lines, done) {
    const W = this.W, H = this.H, pad = this.pad;
    const k = this.add.container(0, 0).setDepth(130);
    this.banner.setVisible(false);
    const dim = this.add.rectangle(0, 0, W, H, 0x05070d, 0.6).setOrigin(0).setInteractive();
    const ps = Math.min(W * 0.2, 90 * D);
    const px = pad + ps * 0.7, py = H * 0.66;
    const g = this.add.graphics();
    this.drawOwner(g, px, py, ps);
    const name = this.add.text(px, py + ps * 1.35, 'Nuri Usta', { fontFamily: FONT, fontSize: Math.round(ps * 0.22) + 'px', fontStyle: '700', color: '#f0a76a' }).setOrigin(0.5, 0);
    const bw = W - pad * 2, fs = Math.round(Math.min(W * 0.046, 19 * D));
    const txt = this.add.text(pad + 18 * D, 0, '', { fontFamily: FONT, fontSize: fs + 'px', fontStyle: '500', color: '#1d1408', wordWrap: { width: bw - 36 * D }, lineSpacing: 4 * D });
    const more = this.add.text(W - pad - 16 * D, 0, 'Dokun ▶', { fontFamily: FONT, fontSize: Math.round(fs * 0.75) + 'px', fontStyle: '700', color: '#9a7424' }).setOrigin(1, 1);
    const bub = this.add.graphics();
    k.add([dim, g, name, bub, txt, more]);
    let li = 0, shown = 0, full = '';
    const layout = () => {
      txt.setText(full);
      const bh = txt.height + 50 * D, by = py - ps * 0.75 - bh - 18 * D;
      txt.setText(full.slice(0, shown)); txt.setY(by + 16 * D);
      more.setPosition(W - pad - 16 * D, by + bh - 10 * D);
      bub.clear();
      bub.fillStyle(0x000000, 0.3).fillRoundedRect(pad, by + 5 * D, bw, bh, 20 * D);
      bub.fillStyle(0xfff6e4, 1).fillRoundedRect(pad, by, bw, bh, 20 * D);
      bub.fillTriangle(px - 14 * D, by + bh - 2, px + 18 * D, by + bh - 2, px, by + bh + 22 * D);
      bub.lineStyle(3 * D, 0xe0b450, 1).strokeRoundedRect(pad, by, bw, bh, 20 * D);
    };
    const start = () => { full = lines[li]; shown = 0; layout(); more.setAlpha(0.3); };
    start();
    const ev = this.time.addEvent({ delay: 22, loop: true, callback: () => {
      if (shown < full.length) { shown += 1; txt.setText(full.slice(0, shown)); if (shown % 3 === 0) beep(420 + Math.random() * 120, 0.03, 'triangle', 0.05); if (shown >= full.length) more.setAlpha(1); }
    } });
    this.tweens.add({ targets: more, x: '-=4', duration: 400, yoyo: true, repeat: -1 });
    dim.on('pointerup', () => {
      if (shown < full.length) { shown = full.length; txt.setText(full); more.setAlpha(1); return; }
      li++;
      if (li >= lines.length) { ev.remove(); k.destroy(); this.dialog = null; sfx.pick(); if (done) done(); return; }
      start(); sfx.tap();
    });
    k.setAlpha(0); this.tweens.add({ targets: k, alpha: 1, duration: 200 });
    this.dialog = k;
  }


  // =====================================================================
  // BAKIM VE MİNİ OYUNLAR
  // =====================================================================
  setAlert(v, kind) {
    if (v.alert) { v.alert.destroy(); v.alert = null; }
    if (!kind) return;
    const s = this.cell;
    const a = this.add.container(v.x + s * 0.3, v.y - s * 0.36).setDepth(45);
    const g = this.add.graphics();
    const col = kind === 'broken' ? 0xe0564a : 0xffc23d;
    g.fillStyle(0x000000, 0.35).fillCircle(0, 2 * D, s * 0.17);
    g.fillStyle(col, 1).fillCircle(0, 0, s * 0.17);
    g.lineStyle(2 * D, 0x2a1405, 1).strokeCircle(0, 0, s * 0.17);
    const t = this.add.text(0, 0, kind === 'broken' ? '✕' : '!', { fontFamily: FONT, fontSize: Math.round(s * 0.24) + 'px', fontStyle: '700', color: '#2a1405' }).setOrigin(0.5);
    a.add([g, t]);
    this.tweens.add({ targets: a, y: a.y - s * 0.06, duration: kind === 'broken' ? 180 : 320, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    v.alert = a;
  }

  speedOf(v, i) {
    if (v.svc === 'broken') return 0;
    let m = 1;
    if (this.hasRingNear(i)) m *= RULES.ringSpeed;
    if (v.boost && state.time > v.boost.until) m *= v.boost.mult; // süre geri sayıyor: time > until iken aktif
    return m;
  }

  flashTip(title, body, accent, ms, done) {
    this.setBanner(title, body, accent);
    this.infoUntil = this.time.now + ms;
    if (done) this.time.delayedCall(ms, done);
  }

  // ---------- mini oyun paneli ----------
  openMinigame(i) {
    if (this.mg) return;
    const v = this.cells[i];
    const W = this.W, s = this.cell;
    const pw = W - this.pad * 2, ph = Math.min(s * 2.9, 290 * D);
    const mc = this.cellCenter(i);
    const gridMid = this.gy + s * ROWS / 2;
    let py = mc.y < gridMid ? mc.y + s * 0.62 : mc.y - s * 0.62 - ph;
    py = Phaser.Math.Clamp(py, 8 * D, this.trayTop - ph - 8 * D);
    const panel = this.add.container(this.pad, py).setDepth(80);
    const g = this.add.graphics();
    const m = MACHINES[v.type];
    // ok ucu makineye
    const tipX = mc.x - this.pad, up = mc.y < py;
    g.fillStyle(0x2a3456, 1);
    if (up) g.fillTriangle(tipX - 14 * D, 2, tipX + 14 * D, 2, tipX, -14 * D);
    else g.fillTriangle(tipX - 14 * D, ph - 2, tipX + 14 * D, ph - 2, tipX, ph + 14 * D);
    g.fillStyle(0x000000, 0.4).fillRoundedRect(0, 6 * D, pw, ph, 20 * D);
    g.fillStyle(0x232c4a, 1).fillRoundedRect(0, 0, pw, ph, 20 * D);
    g.lineStyle(3 * D, 0x2a3456, 1).strokeRoundedRect(0, 0, pw, ph, 20 * D);
    g.lineStyle(2 * D, m.color, 0.9).strokeRoundedRect(3 * D, 3 * D, pw - 6 * D, ph - 6 * D, 17 * D);
    const title = this.add.text(16 * D, 20 * D, MG_TEXT[v.type], { fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.042, 17 * D)) + 'px', fontStyle: '700', color: '#ffe3a8' }).setOrigin(0, 0.5);
    const timer = this.add.graphics();
    panel.add([g, title, timer]);
    const mg = {
      i, v, type: v.type, panel, pw, ph, timer, t: 0, limit: RULES.mgTime, done: false,
      cx: pw / 2, cy: ph * 0.58, gfx: this.add.graphics(), parts: {},
      local: (p) => ({ x: p.x - this.pad, y: p.y - py }),
    };
    panel.add(mg.gfx);
    this.mg = mg;
    panel.setScale(0.85).setAlpha(0);
    this.tweens.add({ targets: panel, scale: 1, alpha: 1, duration: 120, ease: 'Back.easeOut' });
    sfx.pick();
    this['mgInit_' + v.type](mg);
  }

  closeMinigame(grade) {
    const mg = this.mg; if (!mg || mg.done) return;
    mg.done = true;
    (window.__grades = window.__grades || []).push(mg.type + ':' + grade + '@' + mg.t.toFixed(2));
    const v = mg.v, i = mg.i;
    // sonuç
    const R = GRADES[grade];
    const c = this.cellCenter(i);
    const pop = this.add.text(c.x, c.y - this.cell * 0.2, R.label, {
      fontFamily: FONT, fontSize: Math.round(this.cell * (grade === 'perfect' ? 0.36 : 0.28)) + 'px', fontStyle: '700', color: R.color,
      stroke: '#0b0f1c', strokeThickness: 5 * D,
    }).setOrigin(0.5).setDepth(90).setScale(0.4);
    this.tweens.add({ targets: pop, scale: 1, duration: 160, ease: 'Back.easeOut' });
    this.tweens.add({ targets: pop, y: pop.y - this.cell * 0.6, alpha: 0, delay: 650, duration: 400, onComplete: () => pop.destroy() });
    if (grade === 'perfect') {
      [784, 988, 1318].forEach((f, k) => setTimeout(() => beep(f, 0.09, 'triangle', 0.2), k * 60));
      buzz([15, 30, 25]); this.cameras.main.shake(90, 0.005);
      this.sparks.explode(26, c.x, c.y);
    } else if (grade === 'good') { beep(660, 0.1, 'triangle', 0.18); buzz(15); this.sparks.explode(10, c.x, c.y); }
    else { beep(200, 0.15, 'sawtooth', 0.1); buzz([10, 30, 10]); }

    // bakım ısıyı düşürür: Mükemmel tamamen soğutur
    state.heat[i] = Math.min(state.heat[i] || 0, RULES.afterGrade[grade]);
    v.svc = 'ok'; this.setAlert(v, null);
    const applyBoost = (target) => { if (R.mult > 1) target.boost = { mult: R.mult, until: state.time - R.secs }; };
    if (v.type === 'fan') {
      // fan: 2x2 alanındaki makineleri hızlandırır
      this.fanArea(i).forEach(j => {
        const n = this.cells[j];
        if (n && j !== i && R.mult > 1) { applyBoost(n); const nc = this.cellCenter(j); this.sparks.explode(8, nc.x, nc.y); }
      });
    } else applyBoost(v);

    const panel = mg.panel;
    this.tweens.add({ targets: panel, alpha: 0, scale: 0.9, duration: 140, delay: 120, onComplete: () => panel.destroy() });
    this.mg = null;
  }

  mgUpdate(dt) {
    const mg = this.mg; if (!mg) return;
    mg.t += dt;
    const f = Math.max(0, 1 - mg.t / mg.limit);
    const tg = mg.timer; tg.clear();
    tg.fillStyle(0x0b0f1c, 1).fillRoundedRect(mg.pw - 16 * D - mg.pw * 0.3, 14 * D, mg.pw * 0.3, 10 * D, 5 * D);
    tg.fillStyle(f > 0.35 ? 0x5fd38a : 0xe0564a, 1).fillRoundedRect(mg.pw - 16 * D - mg.pw * 0.3, 14 * D, Math.max(10 * D, mg.pw * 0.3 * f), 10 * D, 5 * D);
    this['mgStep_' + mg.type](mg, dt);
    if (this.mg === mg && mg.t >= mg.limit) this.closeMinigame('bad');
  }
  grade(mg, perfectT, goodT) { return mg.t <= perfectT ? 'perfect' : mg.t <= goodT ? 'good' : 'bad'; }

  // --- Krank: dönen kol yeşil bölgeden geçerken dokun (tek dokunuş) ---
  mgInit_crank(mg) {
    mg.R = Math.min(mg.ph * 0.3, mg.pw * 0.25);
    mg.dir = Math.random() < 0.5 ? 1 : -1;
    mg.zone = Phaser.Math.FloatBetween(0, Math.PI * 2);   // yeşil bölgenin ortası
    mg.angle = mg.zone + Math.PI;                           // kol karşıdan başlar
    mg.speed = Math.PI * 2 / 1.25;                          // 1.25 sn'de bir tur
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'Kol yeşilden geçerken dokun', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_crank(mg, dt) {
    mg.angle += mg.dir * mg.speed * dt;
    const g = mg.gfx, R = mg.R, rr = R * 0.7;
    g.clear();
    g.fillStyle(C.brassDark, 1).fillCircle(mg.cx, mg.cy + 3 * D, R);
    g.fillStyle(C.brass, 1).fillCircle(mg.cx, mg.cy, R);
    g.fillStyle(C.brassHi, 0.4).fillCircle(mg.cx - R * 0.2, mg.cy - R * 0.25, R * 0.6);
    g.fillStyle(0x10162a, 1).fillCircle(mg.cx, mg.cy, R * 0.88);
    // yeşil bölge (geniş: iyi, dar: mükemmel)
    const arc = (half, col, w) => { g.lineStyle(w, col, 1); g.beginPath(); g.arc(mg.cx, mg.cy, rr, mg.zone - half, mg.zone + half, false); g.strokePath(); };
    arc(0.42, 0x2e8a52, R * 0.26);
    arc(0.16, 0x7fe3a5, R * 0.26);
    // kol
    const hx = mg.cx + Math.cos(mg.angle) * rr, hy = mg.cy + Math.sin(mg.angle) * rr;
    g.lineStyle(R * 0.12, C.copperDark, 1).lineBetween(mg.cx, mg.cy, hx, hy);
    g.fillStyle(C.copper, 1).fillCircle(mg.cx, mg.cy, R * 0.14);
    g.fillStyle(C.copperDark, 1).fillCircle(hx, hy + 2 * D, R * 0.18);
    g.fillStyle(C.copperHi, 1).fillCircle(hx, hy, R * 0.18);
  }
  mgDown_crank(mg) {
    const d = Math.abs(Phaser.Math.Angle.Wrap(mg.angle - mg.zone));
    this.closeMinigame(d < 0.16 ? 'perfect' : d < 0.42 ? 'good' : 'bad');
  }

  // --- Pres: ritim çubuğu ---
  mgInit_press(mg) {
    mg.bw = mg.pw * 0.8; mg.bx = (mg.pw - mg.bw) / 2; mg.bh = Math.min(44 * D, mg.ph * 0.2);
    mg.zone = Phaser.Math.FloatBetween(0.28, 0.72);
    mg.speed = 1 / 1.1; mg.pos = 0;
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'İbre yeşil bölgedeyken dokun', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_press(mg) {
    mg.pos = (Math.sin(mg.t * Math.PI * 2 * mg.speed - Math.PI / 2) + 1) / 2;
    const g = mg.gfx, y = mg.cy - mg.bh / 2;
    g.clear();
    g.fillStyle(0x0b0f1c, 1).fillRoundedRect(mg.bx, y, mg.bw, mg.bh, mg.bh * 0.3);
    g.fillStyle(0x2e8a52, 1).fillRect(mg.bx + mg.bw * (mg.zone - 0.12), y + 4 * D, mg.bw * 0.24, mg.bh - 8 * D);
    g.fillStyle(0x7fe3a5, 1).fillRect(mg.bx + mg.bw * (mg.zone - 0.045), y + 4 * D, mg.bw * 0.09, mg.bh - 8 * D);
    const nx = mg.bx + mg.bw * mg.pos;
    g.fillStyle(0xffd84a, 1).fillTriangle(nx - 10 * D, y - 14 * D, nx + 10 * D, y - 14 * D, nx, y + 2 * D);
    g.fillStyle(0xffffff, 1).fillRect(nx - 2 * D, y, 4 * D, mg.bh);
  }
  mgDown_press(mg) {
    const d = Math.abs(mg.pos - mg.zone);
    this.closeMinigame(d < 0.045 ? 'perfect' : d < 0.12 ? 'good' : 'bad');
  }

  // --- Basıcı: basılı tut, basıncı doldur, yeşilde bırak ---
  mgInit_mint(mg) {
    mg.gh = mg.ph * 0.5; mg.gw = 34 * D; mg.gx = mg.cx - mg.pw * 0.12; mg.gy = mg.cy - mg.gh / 2 - 8 * D;
    mg.zone = Phaser.Math.FloatBetween(0.55, 0.82); mg.level = 0; mg.hold = false; mg.tick = 0;
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'Basılı tut, yeşilde bırak', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_mint(mg, dt) {
    if (mg.hold) {
      mg.level += dt * (0.3 + mg.level * 0.8);   // giderek hızlanır
      mg.tick -= dt;
      if (mg.tick <= 0) { mg.tick = 0.06; beep(200 + mg.level * 700, 0.03, 'sawtooth', 0.06); }
      if (mg.level >= 1) { mg.level = 1; this.cameras.main.shake(120, 0.006); this.closeMinigame('bad'); return; }
    } else if (mg.level > 0 && !mg.released) mg.level = Math.max(0, mg.level - dt * 0.8);
    const g = mg.gfx, x = mg.gx, y = mg.gy, w = mg.gw, h = mg.gh, lv = mg.level;
    g.clear();
    // gösterge
    g.fillStyle(0x0b0f1c, 1).fillRoundedRect(x - w / 2, y, w, h, w / 2);
    const zy = (f) => y + h * (1 - f);
    g.fillStyle(0x2e8a52, 1).fillRect(x - w / 2 + 4 * D, zy(mg.zone + 0.08), w - 8 * D, h * 0.16);
    g.fillStyle(0x7fe3a5, 1).fillRect(x - w / 2 + 4 * D, zy(mg.zone + 0.03), w - 8 * D, h * 0.06);
    g.fillStyle(0xe0564a, 0.5).fillRect(x - w / 2 + 4 * D, zy(1), w - 8 * D, h * 0.06);
    if (lv > 0) {
      const col = lv > mg.zone + 0.08 ? 0xe0564a : 0x7fd47a;
      g.fillStyle(col, 0.9).fillRoundedRect(x - w * 0.18, zy(lv), w * 0.36, h * lv, w * 0.18);
    }
    g.fillStyle(0xffffff, 1).fillTriangle(x + w / 2 + 2 * D, zy(lv), x + w / 2 + 14 * D, zy(lv) - 8 * D, x + w / 2 + 14 * D, zy(lv) + 8 * D);
    // kol (basınca aşağı iner)
    const bx = mg.cx + mg.pw * 0.14, by = mg.cy, L = mg.ph * 0.3;
    const ang = -0.9 + lv * 1.5;
    const ex = bx + Math.cos(ang) * L, ey = by + Math.sin(ang) * L;
    g.fillStyle(C.copperDark, 1).fillRoundedRect(bx - 20 * D, by - 14 * D, 40 * D, 40 * D, 8 * D);
    g.lineStyle(8 * D, C.copperDark, 1).lineBetween(bx, by, ex, ey);
    g.fillStyle(C.brassDark, 1).fillCircle(ex, ey + 3 * D, 16 * D);
    g.fillStyle(mg.hold ? C.brassHi : C.brass, 1).fillCircle(ex, ey, 16 * D);
    g.fillStyle(C.copper, 1).fillCircle(bx, by, 9 * D);
  }
  mgDown_mint(mg) { if (!mg.released) mg.hold = true; }
  mgUp_mint(mg) {
    if (!mg.hold) return;
    mg.hold = false; mg.released = true;
    const d = mg.level - mg.zone;
    beep(320, 0.08, 'square', 0.2); setTimeout(() => beep(900, 0.06, 'triangle', 0.15), 50);
    this.closeMinigame(Math.abs(d) < 0.035 ? "perfect" : Math.abs(d) < 0.09 ? "good" : "bad");
  }

  // --- Fan: 5 hızlı dokunuş ---
  mgInit_fan(mg) {
    mg.taps = 0; mg.need = 5; mg.spin = 0; mg.rot = 0;
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'Hızlıca 5 kez dokun', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_fan(mg, dt) {
    mg.spin = Math.max(0, mg.spin - dt * 6); mg.rot += (1 + mg.spin * 3) * dt * 4;
    const g = mg.gfx, R = Math.min(mg.ph * 0.3, mg.pw * 0.25);
    g.clear();
    g.fillStyle(C.brassDark, 1).fillCircle(mg.cx, mg.cy + 3 * D, R);
    g.fillStyle(C.brass, 1).fillCircle(mg.cx, mg.cy, R);
    g.fillStyle(0x10162a, 1).fillCircle(mg.cx, mg.cy, R * 0.86);
    for (let k = 0; k < 4; k++) {
      const a = mg.rot + k * Math.PI / 2;
      g.fillStyle(0x8fb4ff, 1).fillTriangle(mg.cx, mg.cy, mg.cx + Math.cos(a - 0.35) * R * 0.78, mg.cy + Math.sin(a - 0.35) * R * 0.78, mg.cx + Math.cos(a + 0.45) * R * 0.78, mg.cy + Math.sin(a + 0.45) * R * 0.78);
    }
    g.fillStyle(C.brass, 1).fillCircle(mg.cx, mg.cy, R * 0.16);
    // dokunuş noktaları
    for (let k = 0; k < mg.need; k++) {
      const x = mg.cx + (k - (mg.need - 1) / 2) * 22 * D, y = mg.cy + R + 18 * D;
      g.fillStyle(k < mg.taps ? 0x8fb4ff : 0x2a3456, 1).fillCircle(x, y, 7 * D);
    }
  }
  mgDown_fan(mg) {
    mg.taps++; mg.spin = 1; beep(500 + mg.taps * 90, 0.05, 'square', 0.12); buzz(8);
    if (mg.taps >= mg.need) this.closeMinigame(this.grade(mg, 1.1, 1.9));
  }

  flowEnergy(from, to) {
    // Krank'tan bu makineye uçan ⚡
    const f = this.cellCenter(from), tc = this.cellCenter(to);
    const bolt = this.add.text(f.x, f.y, '⚡', { fontFamily: FONT, fontSize: Math.round(this.cell * 0.24) + 'px', color: '#4fd6e0', stroke: '#0b0f1c', strokeThickness: 3 * D }).setOrigin(0.5).setDepth(55);
    this.tweens.add({ targets: bolt, x: tc.x, y: tc.y, duration: 320, ease: 'Sine.easeIn', onComplete: () => {
      bolt.destroy();
      this.sparks.explode(4, tc.x, tc.y);
    } });
  }

  update(_, dtMs) {
    const dt = dtMs / 1000;
    this.cells.forEach(v => { if (v && v.blades) v.blades.rotation += dtMs * (state.phase === 'run' && v.svc !== 'broken' ? 0.012 : 0.004); });
    this.slots.forEach(s => { if (s.vis.blades) s.vis.blades.rotation += dtMs * 0.003; });
    this.drawDanger(dtMs);
    this.cells.forEach((v, i) => { if (v) this.drawHeat(v, i); });
    this.drawLinks();
    this.chimneySmoke(dt);
    this.tutT = (this.tutT || 0) + dt;
    if (this.tutT > 0.25) { this.tutT = 0; this.tutorial(); }
    if (state.phase !== 'run' || this.dialog) { if (state.phase === 'build') this.updateHud(false); return; }

    state.time -= dt;
    // önce Krank'lar, sonra tüketiciler
    ['crank', 'press', 'mint'].forEach(type => {
      this.cells.forEach((v, i) => {
        if (!v || v.type !== type) return;
        v.t = (v.t || 0) + dt * this.speedOf(v, i);
        const every = PROD[type].every;
        if (v.t >= every) { v.t -= every; this.produce(i, v); }
        v.setAlpha(v.svc === 'broken' ? 0.45 : (v.stalled === 'power' || v.stalled === 'blocked') ? 0.6 : 1);
      });
    });
    this.cells.forEach(v => { if (v && v.type === 'fan') v.setAlpha(v.svc === 'broken' ? 0.45 : 1); });
    state.res.energy = state.buf.reduce((a, b) => a + b, 0);
    this.tickHeat(dt);
    this.mgUpdate(dt);
    this.tickPressure(dt);
    if (state.phase !== 'run') return;
    const prev = Math.ceil(state.time + dt);
    if (Math.ceil(state.time) !== prev && state.time <= 5 && state.time > 0) { beep(1200, 0.05, 'square', 0.1); buzz(6); }
    this.updateHud(false);
    const can = this.canFinish();
    if (can !== this.goBtn.visible || (can && (this.lastBonus !== this.earlyBonus()))) {
      if (can && !this.goBtn.visible) { this.hint.setText('Hedef tuttu! Bitir ya da para için devam et.'); beep(880, 0.1, 'triangle', 0.18); buzz(20); this.goBtn.setScale(1.2); this.tweens.add({ targets: this.goBtn, scale: 1, duration: 250, ease: 'Back.easeOut' }); }
      this.lastBonus = this.earlyBonus();
      this.goBtn.setVisible(can).label.setText(`✓ Bitir +${this.lastBonus} ●`);
    }
    if (state.time <= 0) { state.time = 0; this.endRound(); }
  }

  chimneySmoke(dt) {
    // basınç yükseldikçe bacadan duman çıkar
    const p = state.pressure;
    if (p < 25 || state.phase === 'boom') return;
    this.smokeT = (this.smokeT || 0) + dt * (0.6 + p / 40);
    if (this.smokeT < 1) return;
    this.smokeT = 0;
    const c = this.chimney, r = this.fac.w * 0.07;
    const puff = this.add.circle(c.x, c.y - r, r, p >= 80 ? 0x7a5048 : 0x8a90a6, 0.7).setDepth(3);
    this.tweens.add({ targets: puff, x: c.x + Phaser.Math.FloatBetween(-4, 10) * D, y: c.y - r * 6, scale: 2.2, alpha: 0, duration: 1100, onComplete: () => puff.destroy() });
  }

  // ---------- yardımcılar ----------
  drawGrid() {
    const g = this.gridG, s = this.cell, gap = Math.max(2, s * 0.04), rr = s * 0.14;
    g.clear();
    const wx = this.gx - 8 * D, wy = this.gy - 8 * D, ww = s * COLS + 16 * D, wh = s * ROWS + 16 * D;
    g.fillStyle(C.copperDark, 1).fillRoundedRect(wx - 3 * D, wy - 3 * D, ww + 6 * D, wh + 6 * D, 18 * D);
    g.fillStyle(C.well, 1).fillRoundedRect(wx, wy, ww, wh, 15 * D);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = this.gx + c * s + gap, y = this.gy + r * s + gap, w = s - gap * 2;
      g.fillStyle(C.cellLo, 1).fillRoundedRect(x, y, w, w, rr);
      g.fillStyle(C.cell, 1).fillRoundedRect(x, y + 2 * D, w, w - 2 * D, rr);
      g.fillStyle(C.cellHi, 0.5).fillRoundedRect(x + w * 0.2, y + w - 4 * D, w * 0.6, 2 * D, 1 * D);
    }
    [[wx + 10 * D, wy + 10 * D], [wx + ww - 10 * D, wy + 10 * D], [wx + 10 * D, wy + wh - 10 * D], [wx + ww - 10 * D, wy + wh - 10 * D]]
      .forEach(([x, y]) => rivet(g, x, y, 3.5 * D));
  }
  cellCenter(i) {
    const c = i % COLS, r = Math.floor(i / COLS);
    return { x: this.gx + c * this.cell + this.cell / 2, y: this.gy + r * this.cell + this.cell / 2 };
  }
  cellAt(x, y) {
    const c = Math.floor((x - this.gx) / this.cell), r = Math.floor((y - this.gy) / this.cell);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
    return r * COLS + c;
  }
  spawnCell(i, type, animate) {
    const p = this.cellCenter(i);
    const v = drawMachine(this, type, this.cell * 0.78).setPosition(p.x, p.y).setDepth(10 + Math.floor(i / COLS));
    v.t = 0; v.cd = 0;
    v.heatG = this.add.graphics();
    v.add(v.heatG);
    this.cells[i] = v;
    this.drawHeat(v, i);
    if (animate) {
      v.y -= this.cell * 0.25; v.setScale(1.15);
      this.tweens.add({ targets: v, y: p.y, scale: 1, duration: 180, ease: 'Bounce.easeOut' });
      this.time.delayedCall(90, () => this.sparks.explode(14, p.x, p.y + this.cell * 0.35));
    }
  }
  ghostY(y) { return y - this.cell * 0.7; }

  // ---------- dokunma ----------
  onDown(p) {
    if (this.dialog || this.shop) return;
    if (state.phase === 'end' || state.phase === 'boom') return;
    if (this.mg) { const f = this['mgDown_' + this.mg.type]; if (f) f.call(this, this.mg, p); return; }
    if (state.phase === 'build' && state.places > 0 && p.y > this.slotTop) {
      const slot = this.slots.find(s => Math.abs(p.x - s.x) < s.r);
      if (slot) {
        this.startDrag(slot.type, -1, p);
        this.showInfo(slot.type);
        this.tweens.add({ targets: slot.vis, scale: 0.85, duration: 60, yoyo: true });
        return;
      }
    }
    if (p.y > this.slotTop) {
      const slot = this.slots.find(s => Math.abs(p.x - s.x) < s.r);
      if (slot) { this.showInfo(slot.type); return; }
    }
    const i = this.cellAt(p.x, p.y);
    if (i >= 0 && state.grid[i]) this.pending = { i, x: p.x, y: p.y };
  }

  startDrag(type, from, p) {
    const ghost = drawMachine(this, type, this.cell * 0.86).setDepth(30);
    ghost.setPosition(p.x, this.ghostY(p.y));
    this.tweens.add({ targets: ghost, angle: { from: -4, to: 4 }, duration: 260, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.drag = { type, from, ghost, rot: null, heat: 0 };
    if (from >= 0) {
      this.drag.rot = state.rot[from]; this.drag.heat = state.heat[from] || 0; this.drag.mod = state.mod[from];
      state.rot[from] = null; state.heat[from] = 0; state.mod[from] = null;
      this.setAlert(this.cells[from], null);
      this.cells[from].destroy();
      this.cells[from] = null;
      state.grid[from] = null;
      this.trashBg.setVisible(true);
      this.trashText.setVisible(true);
    }
    sfx.pick();
    this.updateHighlight(p);
  }

  onMove(p) {
    if (this.dialog || this.shop) return;
    if (this.mg) { const f = this['mgMove_' + this.mg.type]; if (f) f.call(this, this.mg, p); return; }
    if (this.pending && !this.drag) {
      // makineler yalnızca inşa evresinde taşınır
      if (state.phase === 'build' && Phaser.Math.Distance.Between(p.x, p.y, this.pending.x, this.pending.y) > 10 * D) {
        const { i } = this.pending;
        const type = state.grid[i];
        this.pending = null;
        this.startDrag(type, i, p);
      }
      return;
    }
    if (!this.drag) return;
    this.drag.ghost.setPosition(p.x, this.ghostY(p.y));
    this.updateHighlight(p);
  }

  updateHighlight(p) {
    const g = this.hl; g.clear();
    if (p.y > this.trayTop) return;
    const i = this.cellAt(p.x, this.ghostY(p.y));
    if (i < 0) return;
    const c = i % COLS, r = Math.floor(i / COLS), s = this.cell, gap = Math.max(2, s * 0.04);
    const ok = !state.grid[i];
    g.fillStyle(ok ? C.ok : C.bad, 0.18).fillRoundedRect(this.gx + c * s + gap, this.gy + r * s + gap, s - gap * 2, s - gap * 2, s * 0.14);
    g.lineStyle(3 * D, ok ? C.ok : C.bad, 1).strokeRoundedRect(this.gx + c * s + gap, this.gy + r * s + gap, s - gap * 2, s - gap * 2, s * 0.14);
  }

  onUp(p) {
    if (this.dialog || this.shop) return;
    if (this.mg) { const f = this['mgUp_' + this.mg.type]; if (f) f.call(this, this.mg, p); return; }
    if (this.pending && !this.drag) {
      const i = this.pending.i, v = this.cells[i];
      this.pending = null;
      if (v) {
        this.tweens.killTweensOf(v); v.setScale(1);
        this.tweens.add({ targets: v, scaleX: 1.1, scaleY: 0.88, duration: 55, yoyo: true });
        this.sparks.explode(10, p.x, p.y);
        sfx.tap();
        if (state.phase === 'run') {
          if ((state.heat[i] || 0) >= RULES.tapAt) this.openMinigame(i);
          else this.flashTip('Henüz soğuk', 'Isı çubuğu dolmaya başlayınca bakım yapabilirsin. ! çıkınca acele et.', MACHINES[v.type].color, 1800);
        }
        if (state.phase === 'build' && this.pickMod) { this.attachMod(i); return; }
        if (state.phase === 'build') {
          // dokununca döndür
          state.rot[i] = (this.rotOf(i) + 1) % 4;
          beep(520, 0.05, 'triangle', 0.12);
          this.showInfo(v.type);
          this.refreshPhase();
        }
      }
      return;
    }
    if (!this.drag) return;
    const { type, from, ghost } = this.drag;
    this.drag_rot = this.drag.rot; this.drag_heat = this.drag.heat; this.drag_mod = this.drag.mod || null;
    this.drag = null;
    this.tweens.killTweensOf(ghost);
    this.hl.clear();
    this.trashBg.setVisible(false);
    this.trashText.setVisible(false);

    const inTray = p.y > this.trayTop;
    const i = inTray ? -1 : this.cellAt(p.x, this.ghostY(p.y));
    if (i >= 0 && !state.grid[i]) {
      ghost.destroy();
      state.grid[i] = type;
      state.rot[i] = this.drag_rot; state.heat[i] = this.drag_heat; state.mod[i] = from >= 0 ? this.drag_mod : null;
      if (from < 0) state.places--;
      this.spawnCell(i, type, true);
      sfx.place();
    } else if (from >= 0 && (i < 0 || inTray)) {
      // kaldırılan makine hakkı geri verir
      state.places++;
      this.tweens.add({ targets: ghost, scale: 0, angle: 90, alpha: 0, duration: 200, onComplete: () => ghost.destroy() });
      sfx.trash();
    } else if (from >= 0) {
      ghost.destroy();
      state.grid[from] = type;
      state.rot[from] = this.drag_rot; state.heat[from] = this.drag_heat; state.mod[from] = this.drag_mod;
      this.spawnCell(from, type, false);
      this.cameras.main.shake(80, 0.004);
      sfx.bad();
    } else {
      if (i >= 0) { this.cameras.main.shake(80, 0.004); sfx.bad(); }
      this.tweens.add({ targets: ghost, alpha: 0, scale: 0.5, duration: 150, onComplete: () => ghost.destroy() });
    }
    this.refreshPhase();
  }
}

// ---------- başlat ----------
function boot() {
  const el = document.getElementById('game');
  const size = () => [Math.round(el.clientWidth * D), Math.round(el.clientHeight * D)];
  const [w, h] = size();
  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: el,
    backgroundColor: C.bgBot,
    antialias: true,
    scale: { mode: Phaser.Scale.NONE, width: w, height: h, zoom: 1 / D },
    input: { activePointers: 1 },
    scene: [Build],
  });
  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const [nw, nh] = size();
      if (nw !== game.scale.width || nh !== game.scale.height) {
        game.scale.resize(nw, nh);
        game.scale.setZoom(1 / D);
      }
    }, 120);
  });
}
// Yazı tipini bekle (en fazla 1.5 sn), sonra başlat
Promise.race([
  document.fonts ? Promise.all([document.fonts.load('700 20px Fredoka'), document.fonts.load('500 20px Fredoka')]) : Promise.resolve(),
  new Promise(r => setTimeout(r, 1500)),
]).catch(() => {}).then(boot);
</script>

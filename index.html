const D = Math.min(window.devicePixelRatio || 1, 3);
const COLS = 5, ROWS = 6;
const C = {
  bgTop: 0x1a2340, bgBot: 0x0e1322,
  well: 0x0b0f1c, cell: 0x1c2440, cellHi: 0x2a3456, cellLo: 0x121829,
  panel: 0x1b2238, panelHi: 0x2c3654,
  ok: 0x5fd38a, bad: 0xe0564a,
  copperHi: 0xf0a76a, copper: 0xcf7a3e, copperMid: 0xb4622c, copperDark: 0x6e3518,
  brassHi: 0xfbe3a0, brass: 0xe0b450, brassDark: 0x9a7424,
  glass: 0x0d1220, spark: 0xffd84a,
  cream: '#f6ecdb', dim: '#8e97b8', faint: '#4a5272',
};
const FONT = '"Fredoka", system-ui, -apple-system, Segoe UI, Roboto, sans-serif';

const MACHINES = {
  crank: { name: 'Krank',  sym: '⚡', color: 0x4fd6e0, dark: 0x1f8a93 },
  press: { name: 'Pres',   sym: '✦', color: 0xffd84a, dark: 0xb88a12 },
  mint:  { name: 'Basıcı', sym: '●', color: 0x7fd47a, dark: 0x3d8a3a },
  fan:   { name: 'Fan',    sym: '',  color: 0x8fb4ff, dark: 0x3e62b0 },
};
const ORDER = ['crank', 'press', 'mint', 'fan'];
// oyuncuya gösterilen tarif ve açıklama
const INFO = {
  crank: { recipe: '→ ⚡ (2 yön)', title: 'Krank: enerji üretir',     body: 'Enerjiyi sadece mavi okların gösterdiği 2 komşuya verir. Dokun: döndür.' },
  press: { recipe: '⚡ → ✦',   title: 'Pres: kıvılcım yapar',          body: 'Krank\'ın okundan enerji alır. ✦ sarı oktan çıkar; ok boş kareyi göstermeli.' },
  mint:  { recipe: '⚡ → ●',   title: 'Basıcı: para yapar',            body: 'Krank\'ın okundan enerji alır. ● yeşil oktan çıkar; ok boş kareyi göstermeli.' },
  fan:   { recipe: '2×2 soğutur', title: 'Fan: 2×2 alanı soğutur',     body: 'Mavi noktanın köşesindeki 2×2 alan yarı hızda ısınır. Dokun: alanı döndür.' },
};

// Oyun durumu (ekran döndürülünce korunur)
const state = {};

// ---------- ses ve titreşim ----------
let audioCtx = null;
function beep(freq, dur = 0.09, type = 'square', vol = 0.15) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.55, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.01);
  } catch (e) {}
}
function boomSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, len = 1.4, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr * len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t); lp.frequency.exponentialRampToValueAtTime(120, t + len);
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.9, t);
    src.connect(lp).connect(g).connect(audioCtx.destination); src.start(t);
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.8);
    og.gain.setValueAtTime(0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    o.connect(og).connect(audioCtx.destination); o.start(t); o.stop(t + 0.95);
  } catch (e) {}
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
const sfx = {
  pick:  () => { beep(520, 0.06, 'triangle'); buzz(8); },
  place: () => { beep(260, 0.12, 'square', 0.2); setTimeout(() => beep(520, 0.05), 40); buzz(18); },
  bad:   () => { beep(140, 0.15, 'sawtooth', 0.12); buzz([10, 40, 10]); },
  tap:   () => { beep(760, 0.07); buzz(10); },
  trash: () => { beep(300, 0.18, 'sawtooth', 0.1); buzz(25); },
};

// ---------- çizim yardımcıları ----------
function rivet(g, x, y, r) {
  g.fillStyle(C.brassDark, 1).fillCircle(x, y + r * 0.25, r);
  g.fillStyle(C.brass, 1).fillCircle(x, y, r);
  g.fillStyle(C.brassHi, 0.9).fillCircle(x - r * 0.3, y - r * 0.3, r * 0.4);
}
function gauge(g, x, y, r, m) {
  g.fillStyle(C.brassDark, 1).fillCircle(x, y + r * 0.08, r * 1.18);
  g.fillStyle(C.brass, 1).fillCircle(x, y, r * 1.18);
  g.fillStyle(C.brassHi, 0.6).fillCircle(x - r * 0.25, y - r * 0.35, r * 0.85);
  g.fillStyle(C.brass, 1).fillCircle(x, y, r * 1.0);
  g.fillStyle(C.glass, 1).fillCircle(x, y, r * 0.92);
  g.fillStyle(m.dark, 1).fillCircle(x, y, r * 0.78);
  g.fillStyle(m.color, 1).fillCircle(x, y - r * 0.05, r * 0.7);
  // cam parlaması
  g.fillStyle(0xffffff, 0.35).fillEllipse(x - r * 0.25, y - r * 0.38, r * 0.7, r * 0.32);
}

// ---------- makine çizimi ----------
function drawMachine(scene, type, s, withShadow = true) {
  const m = MACHINES[type];
  const k = scene.add.container(0, 0);
  const g = scene.add.graphics();
  const r = s * 0.16;
  const h = s * 0.88;          // gövde yüksekliği
  const top = -s / 2;
  const depth = s * 0.08;      // 3B kalınlık

  if (withShadow) g.fillStyle(0x000000, 0.35).fillEllipse(0, s * 0.47, s * 0.95, s * 0.16);

  // arka parçalar (gövdenin arkasında kalan silüet)
  if (type === 'press') {
    g.fillStyle(C.copperDark, 1).fillRoundedRect(-s * 0.06, top - s * 0.08, s * 0.12, s * 0.2, s * 0.03);
    g.fillStyle(C.brassDark, 1).fillRoundedRect(-s * 0.34, top - s * 0.14, s * 0.68, s * 0.12, s * 0.04);
    g.fillStyle(C.brass, 1).fillRoundedRect(-s * 0.34, top - s * 0.16, s * 0.68, s * 0.1, s * 0.04);
    g.fillStyle(C.brassHi, 0.7).fillRect(-s * 0.3, top - s * 0.15, s * 0.6, s * 0.02);
  }
  if (type === 'crank') {
    g.fillStyle(C.copperDark, 1).fillRoundedRect(s * 0.38, -s * 0.07, s * 0.2, s * 0.12, s * 0.03);
    g.fillStyle(C.brassDark, 1).fillRoundedRect(s * 0.5, -s * 0.06, s * 0.06, s * 0.28, s * 0.03);
    rivet(g, s * 0.53, s * 0.24, s * 0.075);
  }
  if (type === 'mint') {
    g.fillStyle(C.copperDark, 1).fillRoundedRect(-s * 0.58, -s * 0.06, s * 0.18, s * 0.1, s * 0.03);
    g.fillStyle(C.brassDark, 1).fillRoundedRect(-s * 0.56, -s * 0.42, s * 0.06, s * 0.42, s * 0.03);
    rivet(g, -s * 0.53, -s * 0.42, s * 0.08);
  }

  // gövde: alt kalınlık + ana yüz + üst parlama
  g.fillStyle(C.copperDark, 1).fillRoundedRect(-s / 2, top + depth, s, h, r);
  g.fillStyle(C.copperMid, 1).fillRoundedRect(-s / 2, top, s, h, r);
  g.fillStyle(C.copper, 1).fillRoundedRect(-s / 2 + s * 0.03, top + s * 0.02, s * 0.94, h * 0.8, r * 0.85);
  g.fillStyle(C.copperHi, 0.55).fillRoundedRect(-s / 2 + s * 0.07, top + s * 0.04, s * 0.86, s * 0.1, { tl: r * 0.7, tr: r * 0.7, bl: s * 0.02, br: s * 0.02 });
  // panel çizgisi
  g.fillStyle(C.copperMid, 1).fillRect(-s * 0.42, top + h * 0.83, s * 0.84, s * 0.02);

  // makineye özgü ön yüz
  const gy = top + h * 0.46;
  if (type === 'fan') {
    g.fillStyle(C.copperDark, 1).fillCircle(0, gy + s * 0.01, s * 0.34);
    g.fillStyle(C.brass, 1).fillCircle(0, gy, s * 0.33);
    g.fillStyle(C.brassHi, 0.5).fillCircle(-s * 0.08, gy - s * 0.1, s * 0.22);
    g.fillStyle(C.brass, 1).fillCircle(0, gy, s * 0.29);
    g.fillStyle(C.glass, 1).fillCircle(0, gy, s * 0.27);
    g.fillStyle(m.dark, 0.45).fillCircle(0, gy, s * 0.25);
  } else {
    gauge(g, 0, gy, s * 0.2, m);
  }
  // perçinler
  const rv = s * 0.04;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([x, y]) => rivet(g, x * s * 0.36, gy + y * h * 0.33, rv));
  k.add(g);

  if (type === 'fan') {
    const blades = scene.add.graphics().setPosition(0, gy);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const p = (ang, rad) => ({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad });
      const a1 = p(a - 0.35, s * 0.23), a2 = p(a + 0.45, s * 0.23), a3 = p(a + 0.1, s * 0.06);
      blades.fillStyle(m.color, 1).fillTriangle(0, 0, a1.x, a1.y, a2.x, a2.y);
      blades.fillStyle(0xffffff, 0.25).fillTriangle(0, 0, a1.x, a1.y, a3.x, a3.y);
    }
    blades.fillStyle(C.brass, 1).fillCircle(0, 0, s * 0.06);
    blades.fillStyle(C.brassHi, 0.9).fillCircle(-s * 0.015, -s * 0.015, s * 0.025);
    k.add(blades);
    // kafes
    const cage = scene.add.graphics();
    cage.lineStyle(Math.max(1, s * 0.012), C.brassDark, 0.7);
    cage.strokeCircle(0, gy, s * 0.17);
    cage.lineBetween(-s * 0.26, gy, s * 0.26, gy);
    cage.lineBetween(0, gy - s * 0.26, 0, gy + s * 0.26);
    k.add(cage);
    k.blades = blades;
  } else {
    const label = scene.add.text(0, gy - s * 0.01, m.sym, {
      fontFamily: FONT, fontSize: Math.round(s * 0.22) + 'px', fontStyle: '700', color: '#0d1220',
    }).setOrigin(0.5);
    k.add(label);
  }
  k.type = type;
  return k;
}

function newRun() {
  state.grid = new Array(COLS * ROWS).fill(null);
  state.round = 0;
  state.phase = 'build';
  state.res = { spark: 0, energy: 0, money: RULES.startMoney };
  state.time = RULES.roundTime;
  state.places = RULES.startPlaces;
  state.result = null;
  state.pressure = 0;
  state.rot = new Array(COLS * ROWS).fill(null);   // makine yönleri
  state.heat = new Array(COLS * ROWS).fill(0);     // makine ısıları (0-1)
  state.buf = new Array(COLS * ROWS).fill(0);      // Krank'ta biriken enerji
  state.boomT = RULES.boomDelay;
  state.needIntro = true;
  state.mod = new Array(COLS * ROWS).fill(null);   // takılı modüller
  state.offers = null; state.shopOpen = false; state.rerolls = 0;
}
newRun();
state.tutorialDone = false;

function makeButton(scene, x, y, w, h, label, color, onTap) {
  const k = scene.add.container(x, y);
  const g = scene.add.graphics();
  const r = h / 2;
  g.fillStyle(0x000000, 0.3).fillRoundedRect(-w / 2, -h / 2 + 4 * D, w, h, r);
  g.fillStyle(color.dark, 1).fillRoundedRect(-w / 2, -h / 2 + 3 * D, w, h, r);
  g.fillStyle(color.base, 1).fillRoundedRect(-w / 2, -h / 2, w, h, r);
  g.fillStyle(0xffffff, 0.25).fillRoundedRect(-w / 2 + r * 0.6, -h / 2 + h * 0.12, w - r * 1.2, h * 0.22, h * 0.11);
  const t = scene.add.text(0, 0, label, {
    fontFamily: FONT, fontSize: Math.round(h * 0.42) + 'px', fontStyle: '700', color: color.text || '#2a1405',
  }).setOrigin(0.5);
  k.add([g, t]);
  k.label = t;
  k.setSize(w, h).setInteractive();
  k.on('pointerdown', () => { k.setScale(0.95); });
  k.on('pointerout', () => { k.setScale(1); });
  k.on('pointerup', () => { k.setScale(1); onTap(); });
  return k;
}
const BTN_GO = { base: 0x5fd38a, dark: 0x2e8a52, text: '#0d2a18' };
const BTN_BRASS = { base: 0xe0b450, dark: 0x9a7424, text: '#2a1a05' };

class Build extends Phaser.Scene {
  constructor() { super('build'); }

  create() {
    const W = this.scale.width, H = this.scale.height;
    this.W = W; this.H = H;
    this.dialog = null; this.mg = null; this.shop = null; this.pickMod = null; this.lastP = undefined; // sahne yeniden başlarken eski durum kalmasın

    const pad = 16 * D;
    this.pad = pad;
    const trayH = Math.min(H * 0.22, 170 * D);
    const topH = Math.min(H * 0.18, 136 * D);
    this.topH = topH;
    this.cell = Math.floor(Math.min((W - pad * 2) / COLS, (H - topH - trayH - pad * 2) / ROWS));
    this.gx = Math.round((W - this.cell * COLS) / 2);
    this.gy = Math.round(topH + pad + Math.max(0, (H - topH - trayH - pad * 2 - this.cell * ROWS) / 2));

    const bg = this.add.graphics();
    bg.fillGradientStyle(C.bgTop, C.bgTop, C.bgBot, C.bgBot, 1).fillRect(0, 0, W, H);
    bg.lineStyle(1 * D, 0xffffff, 0.03);
    for (let y = 0; y < H; y += 48 * D) bg.lineBetween(0, y, W, y);

    if (!this.textures.exists('spark')) {
      const t = this.make.graphics({ add: false });
      t.fillStyle(0xffffff, 1).fillCircle(8, 8, 8);
      t.generateTexture('spark', 16, 16); t.destroy();
    }
    this.sparks = this.add.particles(0, 0, 'spark', {
      speed: { min: 80 * D, max: 260 * D }, angle: { min: 200, max: 340 }, lifespan: 450,
      scale: { start: 0.55 * D, end: 0 }, tint: [C.spark, C.brassHi, 0xffffff], gravityY: 700 * D,
      blendMode: 'ADD', emitting: false,
    }).setDepth(50);

    this.buildHud();
    this.dangerG = this.add.graphics().setDepth(70);

    this.gridG = this.add.graphics();
    this.hl = this.add.graphics().setDepth(5);
    this.linkG = this.add.graphics().setDepth(6);
    this.portL = this.add.graphics().setDepth(28);
    this.cells = new Array(COLS * ROWS).fill(null);
    this.drawGrid();

    // alt tepsi
    const trayY = H - trayH;
    this.trayTop = trayY;
    const tray = this.add.graphics();
    tray.fillStyle(C.panel, 1).fillRect(0, trayY, W, trayH);
    tray.fillStyle(C.panelHi, 1).fillRect(0, trayY, W, 2 * D);
    tray.fillStyle(0x000000, 0.25).fillRect(0, trayY - 6 * D, W, 6 * D);

    const rowH = Math.min(trayH * 0.3, 48 * D);
    this.slotTop = trayY + rowH + 6 * D;
    this.hint = this.add.text(pad, trayY + rowH / 2 + 4 * D, '', {
      fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.036, 15 * D)) + 'px', fontStyle: '500', color: C.dim,
      wordWrap: { width: W * 0.52 },
    }).setOrigin(0, 0.5);

      return { type, x, y, r: slotW / 2, vis, name, recipe, ring };

    this.trashBg = this.add.rectangle(0, trayY, W, trayH, 0x3a1d22, 0.94).setOrigin(0).setDepth(19).setVisible(false);

    }).setOrigin(0.5).setDepth(20).setVisible(false);

    this.banner = this.add.container(pad, trayY - bnH - 12 * D).setDepth(40).setVisible(false);
    this.bannerG = this.add.graphics();

    this.bannerT2 = this.add.text(14 * D, bnH * 0.66, '', { fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.035, 14 * D)) + 'px', fontStyle: '500', color: C.cream, wordWrap: { width: bnW - 28 * D } }).setOrigin(0, 0.5);

    state.grid.forEach((t, i) => { if (t) this.spawnCell(i, t, false); });

    this.input.on('pointerdown', this.onDown, this);
    this.input.on('pointermove', this.onMove, this);
    this.input.on('pointerup', this.onUp, this);
    this.input.on('pointerupoutside', this.onUp, this);
    this.scale.once('resize', () => this.scene.restart());

    // patlama geri sayımı
    this.countText = this.add.text(W / 2, this.gy + this.cell * ROWS / 2, '', { fontFamily: FONT, fontSize: Math.round(this.cell * 0.9) + 'px', fontStyle: '700', color: '#ffe3a8', stroke: '#7a1a12', strokeThickness: 8 * D }).setOrigin(0.5).setDepth(110).setVisible(false);

    this.refreshPhase();
    if (state.phase === 'end' || state.phase === 'boom') this.showResult();
    if (state.phase === 'build' && state.shopOpen) this.openShop();
    if (state.needIntro && state.phase === 'build' && state.round === 0) {
      // ekran yeniden kurulursa (döndürme) konuşma baştan gösterilir; bitince bir daha çıkmaz
      this.showDialog(state.seenIntro ? STORY.again : STORY.intro, () => { state.needIntro = false; state.seenIntro = true; });
    }
    window.__scene = this; // test ve hata ayıklama için
  }

  // ---------- üst bilgi ----------
  factoryPts(x0, y0, fw, fh) {
    // testere dişi çatılı fabrika silueti + baca
    const x1 = x0 + fw, y1 = y0 + fh, by = y0 + fh * 0.45, th = fh * 0.2, tw = fw / 3;
    const cx0 = x0 + fw * 0.07, cx1 = x0 + fw * 0.22;
    const slope = (x) => by - th * (1 - (x - x0) / tw);
    return [[x0, y1], [x0, by - th], [cx0, slope(cx0)], [cx0, y0], [cx1, y0], [cx1, slope(cx1)],
      [x0 + tw, by], [x0 + tw, by - th], [x0 + 2 * tw, by], [x0 + 2 * tw, by - th], [x1, by], [x1, y1]]
      .map(([x, y]) => new Phaser.Math.Vector2(x, y));
  }
  buildHud() {
    const W = this.W, pad = this.pad, topH = this.topH;
    const row1 = topH * 0.2, row2 = topH * 0.53, row3 = topH * 0.85;
    const titleSize = Math.round(Math.min(W * 0.058, 24 * D));
    this.add.text(pad, row1 + 2 * D, 'TIK TIK FABRIC', { fontFamily: FONT, fontSize: titleSize + 'px', fontStyle: '700', color: '#6e3518' }).setOrigin(0, 0.5);
    this.add.text(pad, row1, 'TIK TIK FABRIC', { fontFamily: FONT, fontSize: titleSize + 'px', fontStyle: '700', color: '#f0a76a' }).setOrigin(0, 0.5);
    this.roundText = this.add.text(W - pad, row1, '', { fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.04, 16 * D)) + 'px', fontStyle: '700', color: C.cream }).setOrigin(1, 0.5);
    const fs = Math.round(Math.min(W * 0.042, 17 * D));

    // basınç: sağda içi dolan fabrika
    const fw = Math.min(W * 0.2, 84 * D), fh = topH * 0.6;
    const fx = W - pad - fw, fy = topH * 0.37;
    this.fac = { x: fx, y: fy, w: fw, h: fh };
    const pts = this.factoryPts(fx, fy, fw, fh);
    const back = this.add.graphics();
    back.fillStyle(0x000000, 0.3).fillPoints(pts.map(p => new Phaser.Math.Vector2(p.x, p.y + 3 * D)), true);
    back.fillStyle(0x0b0f1c, 1).fillPoints(pts, true);
    this.facFill = this.add.graphics();
    const maskG = this.make.graphics({ add: false });
    maskG.fillStyle(0xffffff, 1).fillPoints(pts, true);
    this.facFill.setMask(maskG.createGeometryMask());
    const line = this.add.graphics();
    line.lineStyle(2.5 * D, 0x6e7aa3, 1).strokePoints(pts, true);
    this.pLabel = this.add.text(fx + fw / 2, fy + fh * 0.53, 'BASINÇ', { fontFamily: FONT, fontSize: Math.round(fs * 0.55) + 'px', fontStyle: '700', color: '#c9d2ee', stroke: '#0b0f1c', strokeThickness: 3 * D }).setOrigin(0.5);
    this.pText = this.add.text(fx + fw / 2, fy + fh * 0.8, '', { fontFamily: FONT, fontSize: Math.round(fs * 1.05) + 'px', fontStyle: '700', color: '#f6ecdb', stroke: '#0b0f1c', strokeThickness: 4 * D }).setOrigin(0.5);
    this.chimney = { x: fx + fw * 0.145, y: fy };

    // sol alan: hedef çubuğu, kaynaklar, soğutma
    const L = fx - 12 * D - pad;
    const barH = Math.max(18 * D, fs * 1.35);
    this.bar = { x: pad, y: row2 - barH / 2, w: L, h: barH };
    this.barG = this.add.graphics();
    this.sparkText = this.add.text(pad + L / 2, row2, '', { fontFamily: FONT, fontSize: fs + 'px', fontStyle: '700', color: '#1a1405' }).setOrigin(0.5);
    const vbW = Math.min(L * 0.42, 124 * D), vbH = Math.max(26 * D, fs * 1.55);
    this.ventBtn = makeButton(this, pad + L - vbW / 2, row3, vbW, vbH, `❄ Soğut ${RULES.ventCost}●`, { base: 0x8fb4ff, dark: 0x3e62b0, text: '#0d1a33' }, () => this.vent());
    const restW = L - vbW - 6 * D, fs2 = Math.round(fs * 0.92);
    const mk = (i, key) => this.add.text(pad + restW * (i / 3), row3, '', { fontFamily: FONT, fontSize: fs2 + 'px', fontStyle: '700', color: key }).setOrigin(0, 0.5);
    this.energyText = mk(0, RES.energy.color);
    this.moneyText = mk(1, RES.money.color);
    this.timeText = mk(2, C.cream);
    this.lastRes = {};
    this.updateHud(true);
  }

  updateHud(force) {
    const r = state.res, goal = RULES.goals[state.round];
    this.roundText.setText(`Tur ${state.round + 1} / ${RULES.goals.length}`);
    const b = this.bar, g = this.barG, f = Math.min(1, r.spark / goal);
    g.clear();
    g.fillStyle(0x0b0f1c, 1).fillRoundedRect(b.x, b.y, b.w, b.h, b.h / 2);
    if (f > 0) {
      g.fillStyle(f >= 1 ? 0x5fd38a : 0xe0a72a, 1).fillRoundedRect(b.x, b.y, Math.max(b.h, b.w * f), b.h, b.h / 2);
      g.fillStyle(0xffffff, 0.25).fillRoundedRect(b.x + b.h * 0.3, b.y + b.h * 0.15, Math.max(0, b.w * f - b.h * 0.6), b.h * 0.22, b.h * 0.1);
    }
    g.lineStyle(2 * D, 0x2c3654, 1).strokeRoundedRect(b.x, b.y, b.w, b.h, b.h / 2);
    this.sparkText.setText(`✦ ${r.spark} / ${goal}`).setColor(f > 0.45 ? '#1a1405' : '#ffd84a');
    this.energyText.setText(`⚡ ${r.energy}`);
    this.moneyText.setText(`● ${r.money}`);
    const t = Math.ceil(state.time);
    this.timeText.setText(`⏱ ${t}`).setColor(state.phase === 'run' && t <= 10 ? '#ff7a6b' : C.cream);
    // fabrika dolumu
    const fa = this.fac, pf = Math.min(1, state.pressure / 100), fg = this.facFill;
    fg.clear();
    if (pf > 0) {
      let col = pf >= 1 ? 0xe0564a : pf > 0.8 ? 0xe0564a : pf > 0.55 ? 0xff8a3c : 0xc8743a;
      if (pf >= 1 && Math.floor(this.time.now / 180) % 2) col = 0xffe3a8;
      const h = fa.h * pf, top = fa.y + fa.h - h;
      const wave = Math.sin(this.time.now / 260) * 2 * D;
      fg.fillStyle(col, 1).fillRect(fa.x, top + wave, fa.w * 0.5, h).fillRect(fa.x + fa.w * 0.5, top - wave, fa.w * 0.5, h);
      fg.fillStyle(0xffffff, 0.22).fillRect(fa.x, top + wave, fa.w * 0.5, 2.5 * D).fillRect(fa.x + fa.w * 0.5, top - wave, fa.w * 0.5, 2.5 * D);
    }
    const pInt = Math.floor(state.pressure);
    this.pText.setText(`%${pInt}`);
    if (this.lastP !== undefined && pInt >= this.lastP + 5 && !force) {
      this.tweens.killTweensOf(this.pText); this.pText.setScale(1);
      this.tweens.add({ targets: this.pText, scale: 1.2, duration: 90, yoyo: true });
    }
    if (force || Math.abs(pInt - (this.lastP ?? 0)) >= 5) this.lastP = pInt;
    ['spark', 'energy', 'money'].forEach(k => {
      if (!force && this.lastRes[k] !== undefined && r[k] > this.lastRes[k]) {
        const txt = k === 'spark' ? this.sparkText : k === 'energy' ? this.energyText : this.moneyText;
        this.tweens.killTweensOf(txt); txt.setScale(1);
        this.tweens.add({ targets: txt, scale: 1.12, duration: 70, yoyo: true });
      }
      this.lastRes[k] = r[k];
    });
  }

  vent() {
    if (state.phase !== 'build' || !state.heat.some(h => h > 0.01)) return;
    if (state.res.money < RULES.ventCost) {
      this.cameras.main.shake(80, 0.004); sfx.bad();
      this.flashTip('Yeterli para yok', `Soğutmak için ${RULES.ventCost} ● gerekiyor. Basıcı para üretir.`, MACHINES.mint.color, 2200);
      return;
    }
    state.res.money -= RULES.ventCost;
    state.heat = state.heat.map(h => Math.max(0, h - RULES.ventCool));
    beep(900, 0.25, 'sawtooth', 0.06); setTimeout(() => beep(500, 0.3, 'sawtooth', 0.05), 80); buzz(30);
    const smoke = this.add.particles(0, 0, 'spark', { speed: { min: 30 * D, max: 120 * D }, angle: { min: 240, max: 300 }, lifespan: 700, scale: { start: 0.8 * D, end: 0 }, alpha: { start: 0.8, end: 0 }, tint: [0xdfe6f5, 0x8fb4ff], emitting: false }).setDepth(60);
    this.cells.forEach((v, i) => { if (v) { const c = this.cellCenter(i); smoke.explode(8, c.x, c.y); } });
    smoke.explode(16, this.ventBtn.x, this.ventBtn.y);
    this.time.delayedCall(800, () => smoke.destroy());
    this.refreshPhase();
  }

  refreshPhase() {
    if (state.phase === 'build') state.pressure = this.computePressure();
    const canVent = state.phase === 'build' && state.heat.some(h => h > 0.01);
    this.ventBtn.setAlpha(canVent ? (state.res.money >= RULES.ventCost ? 1 : 0.5) : 0.25);
    const build = state.phase === 'build';
    this.goBtn.setVisible(build || this.canFinish());
    this.goBtn.label.setText(build ? '▶  Başlat' : `✓ Bitir +${this.earlyBonus()} ●`);
    this.slots.forEach(s => { s.vis.setAlpha(build && state.places > 0 ? 1 : 0.35); s.name.setAlpha(build && state.places > 0 ? 1 : 0.35); s.recipe.setAlpha(s.name.alpha); });
    if (build) {
      const n = state.grid.filter(Boolean).length;
      this.hint.setText(state.places > 0
        ? `${state.places} yerleştirme hakkın var. Makineye dokun: döndür.`
        : (n ? 'Hakların bitti. Döndürebilir, taşıyabilir ya da başlatabilirsin.' : ''));
      this.goBtn.setAlpha(n ? 1 : 0.45);
    } else if (state.phase === 'run') {
      this.hint.setText('Isınan makineye (!) dokun, mini oyunla soğut.');
    }
    this.updateHud(true);
    this.tutorial();
  }

  // =====================================================================
  // DÜKKAN VE MODÜLLER
  // =====================================================================
  hasRingNear(i) {
    for (let d = 0; d < 4; d++) { const j = this.nb(i, d); if (j >= 0 && state.grid[j] && state.mod[j] === 'ring') return true; }
    return false;
  }
  rollOffers() {
    const keys = Object.keys(SHOP);
    state.offers = [0, 1, 2].map(() => ({ key: Phaser.Utils.Array.GetRandom(keys), sold: false }));
    // en az bir modül olsun
    if (!state.offers.some(o => SHOP[o.key].mod)) state.offers[0].key = Math.random() < 0.5 ? 'ring' : 'plate';
  }
  drawShopIcon(g, key, x, y, r) {
    if (key === 'ring') {
      g.lineStyle(r * 0.34, C.brassDark, 1).strokeCircle(x, y + r * 0.08, r * 0.62);
      g.lineStyle(r * 0.3, C.brass, 1).strokeCircle(x, y, r * 0.62);
      g.lineStyle(r * 0.1, C.brassHi, 1).beginPath().arc(x, y, r * 0.66, Math.PI * 1.1, Math.PI * 1.6).strokePath();
      [0, 1, 2, 3].forEach(k => { const a = k * Math.PI / 2 + Math.PI / 4; rivet(g, x + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62, r * 0.09); });
    } else if (key === 'plate') {
      g.fillStyle(0x4a5878, 1).fillRoundedRect(x - r * 0.75, y - r * 0.5 + r * 0.1, r * 1.5, r * 1.0, r * 0.2);
      g.fillStyle(0x9fb0c8, 1).fillRoundedRect(x - r * 0.75, y - r * 0.5, r * 1.5, r * 1.0, r * 0.2);
      g.fillStyle(0xc9d6e8, 1).fillRect(x - r * 0.55, y - r * 0.12, r * 1.1, r * 0.08).fillRect(x - r * 0.55, y + r * 0.08, r * 1.1, r * 0.08);
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => rivet(g, x + a * r * 0.58, y + b * r * 0.33, r * 0.08));
    } else if (key === 'place') {
      g.fillStyle(C.cellLo, 1).fillRoundedRect(x - r * 0.7, y - r * 0.7, r * 1.4, r * 1.4, r * 0.25);
      g.lineStyle(r * 0.1, 0x5fd38a, 1).strokeRoundedRect(x - r * 0.7, y - r * 0.7, r * 1.4, r * 1.4, r * 0.25);
      g.fillStyle(0x5fd38a, 1).fillRect(x - r * 0.4, y - r * 0.08, r * 0.8, r * 0.16).fillRect(x - r * 0.08, y - r * 0.4, r * 0.16, r * 0.8);
    } else if (key === 'ice') {
      g.fillStyle(0x8fb4ff, 0.25).fillCircle(x, y, r * 0.8);
      g.lineStyle(r * 0.14, 0xdfe9ff, 1);
      for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; g.lineBetween(x - Math.cos(a) * r * 0.65, y - Math.sin(a) * r * 0.65, x + Math.cos(a) * r * 0.65, y + Math.sin(a) * r * 0.65); }
      g.fillStyle(0xffffff, 1).fillCircle(x, y, r * 0.14);
    }
  }
  openShop() {
    if (this.shop) this.shop.destroy();

    const g = this.add.graphics();
    const fsT = Math.round(Math.min(W * 0.06, 25 * D)), fs = Math.round(Math.min(W * 0.034, 14 * D));

    const money = this.add.text(W / 2, top + fsT * 1.35, `Paran: ● ${state.res.money}`, { fontFamily: FONT, fontSize: Math.round(fsT * 0.7) + 'px', fontStyle: '700', color: RES.money.color }).setOrigin(0.5, 0);
    k.add([dim, g, title, money]);
    const cy0 = top + fsT * 2.6;
    state.offers.forEach((o, n) => {
      const it = SHOP[o.key], x = pad + n * (cardW + gap);

      g.fillStyle(o.sold ? 0x161c2e : 0x232c4a, 1).fillRoundedRect(x, cy0, cardW, cardH, 16 * D);
      g.lineStyle(2 * D, o.sold ? 0x2c3654 : it.color, 1).strokeRoundedRect(x, cy0, cardW, cardH, 16 * D);
      const ig = this.add.graphics().setAlpha(o.sold ? 0.3 : 1);
      this.drawShopIcon(ig, o.key, x + cardW / 2, cy0 + cardH * 0.2, cardW * 0.22);

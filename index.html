<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
// Tık Tık Fabric — Adım 4: basınç ve patlama
// Tüm çizim cihazın gerçek piksel yoğunluğunda yapılır (D = devicePixelRatio), böylece keskin görünür.

const D = Math.min(window.devicePixelRatio || 1, 3);
const COLS = 5, ROWS = 6;
const C = {
  bgTop: 0x1a2340, bgBot: 0x0e1322,
  well: 0x0b0f1c, cell: 0x1c2440, cellHi: 0x2a3456, cellLo: 0x121829,
  panel: 0x1b2238, panelHi: 0x2c3654,
  ok: 0x5fd38a, bad: 0xe0564a,
  copperHi: 0xf0a76a, copper: 0xcf7a3e, copperMid: 0xb4622c, copperDark: 0x6e3518,
  brassHi: 0xfbe3a0, brass: 0xe0b450, brassDark: 0x9a7424,
  glass: 0x0d1220, spark: 0xffd84a,
  cream: '#f6ecdb', dim: '#8e97b8', faint: '#4a5272',
};
const FONT = '"Fredoka", system-ui, -apple-system, Segoe UI, Roboto, sans-serif';

const MACHINES = {
  crank: { name: 'Krank',  sym: '⚡', color: 0x4fd6e0, dark: 0x1f8a93 },
  press: { name: 'Pres',   sym: '✦', color: 0xffd84a, dark: 0xb88a12 },
  mint:  { name: 'Basıcı', sym: '●', color: 0x7fd47a, dark: 0x3d8a3a },
  fan:   { name: 'Fan',    sym: '',  color: 0x8fb4ff, dark: 0x3e62b0 },
};
const ORDER = ['crank', 'press', 'mint', 'fan'];
// oyuncuya gösterilen tarif ve açıklama
const INFO = {
  crank: { recipe: '→ ⚡',     title: 'Krank: enerji üretir',          body: 'Her saniye +1 ⚡ enerji. Diğer makineler bu enerjiyle çalışır.' },
  press: { recipe: '⚡ → ✦',   title: 'Pres: kıvılcım yapar',          body: '1 ⚡ harcar, 1 ✦ yapar. Tur hedefi kıvılcımdır!' },
  mint:  { recipe: '⚡ → ●',   title: 'Basıcı: para yapar',            body: '1 ⚡ harcar, 1 ● yapar. Para ileride dükkanda harcanacak.' },
  fan:   { recipe: 'soğutur',  title: 'Fan: komşularını soğutur',     body: 'Yanındaki makinelerin basıncını yarıya indirir. Bakımı iyi yapılırsa komşularını hızlandırır.' },
};

// Oyun durumu (ekran döndürülünce korunur)
const state = {};

// ---------- ses ve titreşim ----------
let audioCtx = null;
function beep(freq, dur = 0.09, type = 'square', vol = 0.15) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 0.55, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.01);
  } catch (e) {}
}
function boomSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, len = 1.4, sr = audioCtx.sampleRate;
    const buf = audioCtx.createBuffer(1, sr * len, sr), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t); lp.frequency.exponentialRampToValueAtTime(120, t + len);
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.9, t);
    src.connect(lp).connect(g).connect(audioCtx.destination); src.start(t);
    const o = audioCtx.createOscillator(), og = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.8);
    og.gain.setValueAtTime(0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    o.connect(og).connect(audioCtx.destination); o.start(t); o.stop(t + 0.95);
  } catch (e) {}
}
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
const sfx = {
  pick:  () => { beep(520, 0.06, 'triangle'); buzz(8); },
  place: () => { beep(260, 0.12, 'square', 0.2); setTimeout(() => beep(520, 0.05), 40); buzz(18); },
  bad:   () => { beep(140, 0.15, 'sawtooth', 0.12); buzz([10, 40, 10]); },
  tap:   () => { beep(760, 0.07); buzz(10); },
  trash: () => { beep(300, 0.18, 'sawtooth', 0.1); buzz(25); },
};

// ---------- çizim yardımcıları ----------
function rivet(g, x, y, r) {
  g.fillStyle(C.brassDark, 1).fillCircle(x, y + r * 0.25, r);
  g.fillStyle(C.brass, 1).fillCircle(x, y, r);
  g.fillStyle(C.brassHi, 0.9).fillCircle(x - r * 0.3, y - r * 0.3, r * 0.4);
}
function gauge(g, x, y, r, m) {
  g.fillStyle(C.brassDark, 1).fillCircle(x, y + r * 0.08, r * 1.18);
  g.fillStyle(C.brass, 1).fillCircle(x, y, r * 1.18);
  g.fillStyle(C.brassHi, 0.6).fillCircle(x - r * 0.25, y - r * 0.35, r * 0.85);
  g.fillStyle(C.brass, 1).fillCircle(x, y, r * 1.0);
  g.fillStyle(C.glass, 1).fillCircle(x, y, r * 0.92);
  g.fillStyle(m.dark, 1).fillCircle(x, y, r * 0.78);
  g.fillStyle(m.color, 1).fillCircle(x, y - r * 0.05, r * 0.7);
  // cam parlaması
  g.fillStyle(0xffffff, 0.35).fillEllipse(x - r * 0.25, y - r * 0.38, r * 0.7, r * 0.32);
}

// ---------- makine çizimi ----------
function drawMachine(scene, type, s, withShadow = true) {
  const m = MACHINES[type];
  const k = scene.add.container(0, 0);
  const g = scene.add.graphics();
  const r = s * 0.16;
  const h = s * 0.88;          // gövde yüksekliği
  const top = -s / 2;
  const depth = s * 0.08;      // 3B kalınlık

  if (withShadow) g.fillStyle(0x000000, 0.35).fillEllipse(0, s * 0.47, s * 0.95, s * 0.16);

  // arka parçalar (gövdenin arkasında kalan silüet)
  if (type === 'press') {
    g.fillStyle(C.copperDark, 1).fillRoundedRect(-s * 0.06, top - s * 0.08, s * 0.12, s * 0.2, s * 0.03);
    g.fillStyle(C.brassDark, 1).fillRoundedRect(-s * 0.34, top - s * 0.14, s * 0.68, s * 0.12, s * 0.04);
    g.fillStyle(C.brass, 1).fillRoundedRect(-s * 0.34, top - s * 0.16, s * 0.68, s * 0.1, s * 0.04);
    g.fillStyle(C.brassHi, 0.7).fillRect(-s * 0.3, top - s * 0.15, s * 0.6, s * 0.02);
  }
  if (type === 'crank') {
    g.fillStyle(C.copperDark, 1).fillRoundedRect(s * 0.38, -s * 0.07, s * 0.2, s * 0.12, s * 0.03);
    g.fillStyle(C.brassDark, 1).fillRoundedRect(s * 0.5, -s * 0.06, s * 0.06, s * 0.28, s * 0.03);
    rivet(g, s * 0.53, s * 0.24, s * 0.075);
  }
  if (type === 'mint') {
    g.fillStyle(C.copperDark, 1).fillRoundedRect(-s * 0.58, -s * 0.06, s * 0.18, s * 0.1, s * 0.03);
    g.fillStyle(C.brassDark, 1).fillRoundedRect(-s * 0.56, -s * 0.42, s * 0.06, s * 0.42, s * 0.03);
    rivet(g, -s * 0.53, -s * 0.42, s * 0.08);
  }

  // gövde: alt kalınlık + ana yüz + üst parlama
  g.fillStyle(C.copperDark, 1).fillRoundedRect(-s / 2, top + depth, s, h, r);
  g.fillStyle(C.copperMid, 1).fillRoundedRect(-s / 2, top, s, h, r);
  g.fillStyle(C.copper, 1).fillRoundedRect(-s / 2 + s * 0.03, top + s * 0.02, s * 0.94, h * 0.8, r * 0.85);
  g.fillStyle(C.copperHi, 0.55).fillRoundedRect(-s / 2 + s * 0.07, top + s * 0.04, s * 0.86, s * 0.1, { tl: r * 0.7, tr: r * 0.7, bl: s * 0.02, br: s * 0.02 });
  // panel çizgisi
  g.fillStyle(C.copperMid, 1).fillRect(-s * 0.42, top + h * 0.83, s * 0.84, s * 0.02);

  // makineye özgü ön yüz
  const gy = top + h * 0.46;
  if (type === 'fan') {
    g.fillStyle(C.copperDark, 1).fillCircle(0, gy + s * 0.01, s * 0.34);
    g.fillStyle(C.brass, 1).fillCircle(0, gy, s * 0.33);
    g.fillStyle(C.brassHi, 0.5).fillCircle(-s * 0.08, gy - s * 0.1, s * 0.22);
    g.fillStyle(C.brass, 1).fillCircle(0, gy, s * 0.29);
    g.fillStyle(C.glass, 1).fillCircle(0, gy, s * 0.27);
    g.fillStyle(m.dark, 0.45).fillCircle(0, gy, s * 0.25);
  } else {
    gauge(g, 0, gy, s * 0.2, m);
  }
  // perçinler
  const rv = s * 0.04;
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([x, y]) => rivet(g, x * s * 0.36, gy + y * h * 0.33, rv));
  k.add(g);

  if (type === 'fan') {
    const blades = scene.add.graphics().setPosition(0, gy);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      const p = (ang, rad) => ({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad });
      const a1 = p(a - 0.35, s * 0.23), a2 = p(a + 0.45, s * 0.23), a3 = p(a + 0.1, s * 0.06);
      blades.fillStyle(m.color, 1).fillTriangle(0, 0, a1.x, a1.y, a2.x, a2.y);
      blades.fillStyle(0xffffff, 0.25).fillTriangle(0, 0, a1.x, a1.y, a3.x, a3.y);
    }
    blades.fillStyle(C.brass, 1).fillCircle(0, 0, s * 0.06);
    blades.fillStyle(C.brassHi, 0.9).fillCircle(-s * 0.015, -s * 0.015, s * 0.025);
    k.add(blades);
    // kafes
    const cage = scene.add.graphics();
    cage.lineStyle(Math.max(1, s * 0.012), C.brassDark, 0.7);
    cage.strokeCircle(0, gy, s * 0.17);
    cage.lineBetween(-s * 0.26, gy, s * 0.26, gy);
    cage.lineBetween(0, gy - s * 0.26, 0, gy + s * 0.26);
    k.add(cage);
    k.blades = blades;
  } else {
    const label = scene.add.text(0, gy - s * 0.01, m.sym, {
      fontFamily: FONT, fontSize: Math.round(s * 0.22) + 'px', fontStyle: '700', color: '#0d1220',
    }).setOrigin(0.5);
    k.add(label);
  }
  k.type = type;
  return k;
}

// ---------- oyun kuralları (denge için tek yer) ----------
const RULES = {
  roundTime: 60,                       // saniye
  goals: [30, 60, 100, 150, 220],      // tur hedefleri (✦)
  startPlaces: 3,                      // 1. turda yerleştirme hakkı
  placesPerRound: 2,                   // sonraki turlarda eklenen hak
  startMoney: 10,
  wear: { crank: [7, 12], press: [8, 13], mint: [10, 15], fan: [11, 17] }, // tür başına bakım aralığı (sn)
  startStagger: 2.2,                   // tur başında makineler arası ek gecikme (sn)
  requestGap: 1.4,                     // iki bakım uyarısı arası en az süre (sn)
  maxRequestsPer: 4,                   // her 4 makine için aynı anda en fazla 1 bakım uyarısı
  breakAfter: 5,                       // bakım istedikten kaç saniye sonra durur
  mgTime: 4,
  pressBroken: 4,                      // bozuk makine: saniyede +%4 basınç
  pressNeed: 0.8,                      // bakım bekleyen makine: saniyede +%0.8
  fanCool: 0.5,                        // yanında çalışan Fan varsa basınç yarıya iner
  pressWinDrop: 25,                    // hedef tutunca basınç %25 düşer
  pressCalm: 0.8,                      // hiçbir makine bakım beklemiyorsa saniyede %0.8 düşer
  pressPerfect: 4, pressGood: 1.5,     // Mükemmel / İyi bakım basıncı bu kadar düşürür
  ventCost: 5, ventDrop: 15,           // tahliye vanası: 5 ● ile %15 düşür (inşa evresinde)
  pressMiss: 80,                       // hedefin eksik kalan oranı x 80 = eklenen basınç                           // mini oyun süre sınırı
  bonusEvery: 3,                       // hedef tutunca: kalan her 3 sn = +1 ● bonus
};
// her makine: kaç saniyede bir çalışır, ne harcar, ne üretir
const PROD = {
  crank: { every: 1.0, cost: null,     out: 'energy' },
  press: { every: 1.5, cost: 'energy', out: 'spark' },
  mint:  { every: 2.5, cost: 'energy', out: 'money' },
  fan:   { every: 0,   cost: null,     out: null },     // Adım 4'te soğutacak
};
const GRADES = {
  perfect: { label: 'MÜKEMMEL!', color: '#7fe3a5', mult: 2,   secs: 6 },
  good:    { label: 'İYİ',       color: '#ffe3a8', mult: 1.4, secs: 4 },
  bad:     { label: 'KÖTÜ',      color: '#ff8a7c', mult: 1,   secs: 0 },
};
const MG_TEXT = { crank: 'Krank: zamanla!', press: 'Pres: zamanla!', mint: 'Basıcı: basıncı ayarla!', fan: 'Fan: hızlandır!' };
const RES = {
  spark:  { sym: '✦', color: '#ffd84a' },
  energy: { sym: '⚡', color: '#4fd6e0' },
  money:  { sym: '●', color: '#7fd47a' },
};

function newRun() {
  state.grid = new Array(COLS * ROWS).fill(null);
  state.round = 0;
  state.phase = 'build';
  state.res = { spark: 0, energy: 0, money: RULES.startMoney };
  state.time = RULES.roundTime;
  state.places = RULES.startPlaces;
  state.result = null;
  state.pressure = 0;
}
newRun();
state.tutorialDone = false;

function makeButton(scene, x, y, w, h, label, color, onTap) {
  const k = scene.add.container(x, y);
  const g = scene.add.graphics();
  const r = h / 2;
  g.fillStyle(0x000000, 0.3).fillRoundedRect(-w / 2, -h / 2 + 4 * D, w, h, r);
  g.fillStyle(color.dark, 1).fillRoundedRect(-w / 2, -h / 2 + 3 * D, w, h, r);
  g.fillStyle(color.base, 1).fillRoundedRect(-w / 2, -h / 2, w, h, r);
  g.fillStyle(0xffffff, 0.25).fillRoundedRect(-w / 2 + r * 0.6, -h / 2 + h * 0.12, w - r * 1.2, h * 0.22, h * 0.11);
  const t = scene.add.text(0, 0, label, {
    fontFamily: FONT, fontSize: Math.round(h * 0.42) + 'px', fontStyle: '700', color: color.text || '#2a1405',
  }).setOrigin(0.5);
  k.add([g, t]);
  k.label = t;
  k.setSize(w, h).setInteractive();
  k.on('pointerdown', () => { k.setScale(0.95); });
  k.on('pointerout', () => { k.setScale(1); });
  k.on('pointerup', () => { k.setScale(1); onTap(); });
  return k;
}
const BTN_GO = { base: 0x5fd38a, dark: 0x2e8a52, text: '#0d2a18' };
const BTN_BRASS = { base: 0xe0b450, dark: 0x9a7424, text: '#2a1a05' };

class Build extends Phaser.Scene {
  constructor() { super('build'); }

  create() {
    const W = this.scale.width, H = this.scale.height;
    this.W = W; this.H = H;

    const pad = 16 * D;
    this.pad = pad;
    const trayH = Math.min(H * 0.22, 170 * D);
    const topH = Math.min(H * 0.18, 136 * D);
    this.topH = topH;
    this.cell = Math.floor(Math.min((W - pad * 2) / COLS, (H - topH - trayH - pad * 2) / ROWS));
    this.gx = Math.round((W - this.cell * COLS) / 2);
    this.gy = Math.round(topH + pad + Math.max(0, (H - topH - trayH - pad * 2 - this.cell * ROWS) / 2));

    const bg = this.add.graphics();
    bg.fillGradientStyle(C.bgTop, C.bgTop, C.bgBot, C.bgBot, 1).fillRect(0, 0, W, H);
    bg.lineStyle(1 * D, 0xffffff, 0.03);
    for (let y = 0; y < H; y += 48 * D) bg.lineBetween(0, y, W, y);

    if (!this.textures.exists('spark')) {
      const t = this.make.graphics({ add: false });
      t.fillStyle(0xffffff, 1).fillCircle(8, 8, 8);
      t.generateTexture('spark', 16, 16); t.destroy();
    }
    this.sparks = this.add.particles(0, 0, 'spark', {
      speed: { min: 80 * D, max: 260 * D }, angle: { min: 200, max: 340 }, lifespan: 450,
      scale: { start: 0.55 * D, end: 0 }, tint: [C.spark, C.brassHi, 0xffffff], gravityY: 700 * D,
      blendMode: 'ADD', emitting: false,
    }).setDepth(50);

    this.buildHud();
    this.dangerG = this.add.graphics().setDepth(70);

    this.gridG = this.add.graphics();
    this.hl = this.add.graphics().setDepth(5);
    this.cells = new Array(COLS * ROWS).fill(null);
    this.drawGrid();

    // alt tepsi
    const trayY = H - trayH;
    this.trayTop = trayY;
    const tray = this.add.graphics();
    tray.fillStyle(C.panel, 1).fillRect(0, trayY, W, trayH);
    tray.fillStyle(C.panelHi, 1).fillRect(0, trayY, W, 2 * D);
    tray.fillStyle(0x000000, 0.25).fillRect(0, trayY - 6 * D, W, 6 * D);

    const rowH = Math.min(trayH * 0.3, 48 * D);
    this.slotTop = trayY + rowH + 6 * D;
    this.hint = this.add.text(pad, trayY + rowH / 2 + 4 * D, '', {
      fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.036, 15 * D)) + 'px', fontStyle: '500', color: C.dim,
      wordWrap: { width: W * 0.52 },
    }).setOrigin(0, 0.5);
    const bw = Math.min(W * 0.38, 170 * D), bh = rowH * 0.82;
    this.goBtn = makeButton(this, W - pad - bw / 2, trayY + rowH / 2 + 4 * D, bw, bh, '▶  Başlat', BTN_GO, () => (state.phase === 'run' ? this.finishEarly() : this.startRound()));

    const slotW = (W - pad * 2) / ORDER.length;
    const slotH = H - this.slotTop;
    const icon = Math.min(slotW * 0.5, slotH * 0.42);
    this.slots = ORDER.map((type, i) => {
      const x = pad + slotW * i + slotW / 2;
      const y = this.slotTop + slotH * 0.33;
      const vis = drawMachine(this, type, icon).setPosition(x, y);
      const name = this.add.text(x, y + icon * 0.58, MACHINES[type].name, {
        fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.034, 14 * D)) + 'px', fontStyle: '700', color: C.cream,
      }).setOrigin(0.5, 0);
      const recipe = this.add.text(x, name.y + name.height + 1 * D, INFO[type].recipe, {
        fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.032, 13 * D)) + 'px', fontStyle: '500', color: C.dim,
      }).setOrigin(0.5, 0);
      const ring = this.add.graphics().setPosition(x, y).setDepth(4).setVisible(false);
      ring.lineStyle(3 * D, 0x5fd38a, 1).strokeCircle(0, 0, icon * 0.72);
      this.tweens.add({ targets: ring, scale: { from: 0.9, to: 1.12 }, alpha: { from: 1, to: 0.3 }, duration: 600, yoyo: true, repeat: -1 });
      return { type, x, y, r: slotW / 2, vis, name, recipe, ring };
    });

    this.trashBg = this.add.rectangle(0, trayY, W, trayH, 0x3a1d22, 0.94).setOrigin(0).setDepth(19).setVisible(false);
    this.trashText = this.add.text(W / 2, trayY + trayH / 2, '✕  Kaldırmak için buraya bırak', {
      fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.044, 18 * D)) + 'px', fontStyle: '700', color: '#ffb3ab',
    }).setOrigin(0.5).setDepth(20).setVisible(false);

    // bilgi kartı (makine açıklaması ve öğretici)
    const bnH = Math.min(84 * D, H * 0.11), bnW = W - pad * 2;
    this.banner = this.add.container(pad, trayY - bnH - 12 * D).setDepth(40).setVisible(false);
    this.bannerG = this.add.graphics();
    this.bannerT1 = this.add.text(14 * D, bnH * 0.3, '', { fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.042, 17 * D)) + 'px', fontStyle: '700', color: '#ffe3a8' }).setOrigin(0, 0.5);
    this.bannerT2 = this.add.text(14 * D, bnH * 0.66, '', { fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.035, 14 * D)) + 'px', fontStyle: '500', color: C.cream, wordWrap: { width: bnW - 28 * D } }).setOrigin(0, 0.5);
    this.banner.add([this.bannerG, this.bannerT1, this.bannerT2]);
    this.bannerSize = { w: bnW, h: bnH };
    this.goRing = this.add.graphics().setDepth(4).setVisible(false);
    this.goRing.lineStyle(3 * D, 0x5fd38a, 1).strokeRoundedRect(this.goBtn.x - this.goBtn.width / 2 - 6 * D, this.goBtn.y - this.goBtn.height / 2 - 6 * D, this.goBtn.width + 12 * D, this.goBtn.height + 12 * D, this.goBtn.height / 2 + 6 * D);
    this.tweens.add({ targets: this.goRing, alpha: { from: 1, to: 0.2 }, duration: 600, yoyo: true, repeat: -1 });

    state.grid.forEach((t, i) => { if (t) this.spawnCell(i, t, false); });

    this.drag = null;
    this.input.on('pointerdown', this.onDown, this);
    this.input.on('pointermove', this.onMove, this);
    this.input.on('pointerup', this.onUp, this);
    this.input.on('pointerupoutside', this.onUp, this);
    this.scale.once('resize', () => this.scene.restart());

    this.refreshPhase();
    if (state.phase === 'end' || state.phase === 'boom') this.showResult();
    window.__scene = this; // test ve hata ayıklama için
  }

  // ---------- üst bilgi ----------
  buildHud() {
    const W = this.W, pad = this.pad, topH = this.topH;
    const row1 = topH * 0.22, row2 = topH * 0.55, row3 = topH * 0.86;
    const titleSize = Math.round(Math.min(W * 0.058, 24 * D));
    this.add.text(pad, row1 + 2 * D, 'TIK TIK FABRIC', { fontFamily: FONT, fontSize: titleSize + 'px', fontStyle: '700', color: '#6e3518' }).setOrigin(0, 0.5);
    this.add.text(pad, row1, 'TIK TIK FABRIC', { fontFamily: FONT, fontSize: titleSize + 'px', fontStyle: '700', color: '#f0a76a' }).setOrigin(0, 0.5);
    this.roundText = this.add.text(W - pad, row1, '', { fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.04, 16 * D)) + 'px', fontStyle: '700', color: C.cream }).setOrigin(1, 0.5);

    // hedef çubuğu (✦)
    const fs = Math.round(Math.min(W * 0.042, 17 * D));
    const barW = (W - pad * 2) * 0.46, barH = Math.max(18 * D, fs * 1.35);
    this.bar = { x: pad, y: row2 - barH / 2, w: barW, h: barH };
    this.barG = this.add.graphics();
    this.sparkText = this.add.text(pad + barW / 2, row2, '', { fontFamily: FONT, fontSize: fs + 'px', fontStyle: '700', color: '#1a1405' }).setOrigin(0.5);

    const restX = pad + barW + 12 * D, restW = W - pad - restX;
    const mk = (i, key) => this.add.text(restX + restW * (i / 3), row2, '', { fontFamily: FONT, fontSize: fs + 'px', fontStyle: '700', color: key }).setOrigin(0, 0.5);
    this.energyText = mk(0, RES.energy.color);
    this.moneyText = mk(1, RES.money.color);
    this.timeText = mk(2, C.cream);
    // basınç çubuğu (▲)
    const pbH = Math.max(14 * D, fs * 0.95);
    const vbW = Math.min(W * 0.3, 128 * D);
    this.pbar = { x: pad, y: row3 - pbH / 2, w: W - pad * 2 - vbW - 8 * D, h: pbH };
    this.ventBtn = makeButton(this, W - pad - vbW / 2, row3, vbW, Math.max(pbH * 1.5, 28 * D), `▼ %${RULES.ventDrop}  ${RULES.ventCost}●`, { base: 0x8fb4ff, dark: 0x3e62b0, text: '#0d1a33' }, () => this.vent());
    this.pbarG = this.add.graphics();
    this.pText = this.add.text(pad + 10 * D, row3, '', { fontFamily: FONT, fontSize: Math.round(fs * 0.8) + 'px', fontStyle: '700', color: '#f6ecdb' }).setOrigin(0, 0.5);
    this.lastRes = {};
    this.updateHud(true);
  }

  updateHud(force) {
    const r = state.res, goal = RULES.goals[state.round];
    this.roundText.setText(`Tur ${state.round + 1} / ${RULES.goals.length}`);
    const b = this.bar, g = this.barG, f = Math.min(1, r.spark / goal);
    g.clear();
    g.fillStyle(0x0b0f1c, 1).fillRoundedRect(b.x, b.y, b.w, b.h, b.h / 2);
    if (f > 0) {
      g.fillStyle(f >= 1 ? 0x5fd38a : 0xe0a72a, 1).fillRoundedRect(b.x, b.y, Math.max(b.h, b.w * f), b.h, b.h / 2);
      g.fillStyle(0xffffff, 0.25).fillRoundedRect(b.x + b.h * 0.3, b.y + b.h * 0.15, Math.max(0, b.w * f - b.h * 0.6), b.h * 0.22, b.h * 0.1);
    }
    g.lineStyle(2 * D, 0x2c3654, 1).strokeRoundedRect(b.x, b.y, b.w, b.h, b.h / 2);
    this.sparkText.setText(`✦ ${r.spark} / ${goal}`).setColor(f > 0.45 ? '#1a1405' : '#ffd84a');
    this.energyText.setText(`⚡ ${r.energy}`);
    this.moneyText.setText(`● ${r.money}`);
    const t = Math.ceil(state.time);
    const pb = this.pbar, pg = this.pbarG, pf = Math.min(1, state.pressure / 100);
    pg.clear();
    pg.fillStyle(0x0b0f1c, 1).fillRoundedRect(pb.x, pb.y, pb.w, pb.h, pb.h / 2);
    if (pf > 0) {
      const col = pf > 0.85 ? 0xe0564a : pf > 0.6 ? 0xff8a3c : 0xc8743a;
      pg.fillStyle(col, 1).fillRoundedRect(pb.x, pb.y, Math.max(pb.h, pb.w * pf), pb.h, pb.h / 2);
    }
    pg.lineStyle(2 * D, 0x2c3654, 1).strokeRoundedRect(pb.x, pb.y, pb.w, pb.h, pb.h / 2);
    this.pText.setText(`▲ Basınç %${Math.floor(state.pressure)}`);
    this.timeText.setText(`⏱ ${t}`).setColor(state.phase === 'run' && t <= 10 ? '#ff7a6b' : C.cream);
    ['spark', 'energy', 'money'].forEach(k => {
      if (!force && this.lastRes[k] !== undefined && r[k] > this.lastRes[k]) {
        const txt = k === 'spark' ? this.sparkText : k === 'energy' ? this.energyText : this.moneyText;
        this.tweens.killTweensOf(txt); txt.setScale(1);
        this.tweens.add({ targets: txt, scale: 1.12, duration: 70, yoyo: true });
      }
      this.lastRes[k] = r[k];
    });
  }

  vent() {
    if (state.phase !== 'build' || state.pressure <= 0) return;
    if (state.res.money < RULES.ventCost) {
      this.cameras.main.shake(80, 0.004); sfx.bad();
      this.flashTip('Yeterli para yok', `Tahliye için ${RULES.ventCost} ● gerekiyor. Basıcı para üretir.`, MACHINES.mint.color, 2200);
      return;
    }
    state.res.money -= RULES.ventCost;
    state.pressure = Math.max(0, state.pressure - RULES.ventDrop);
    beep(900, 0.25, 'sawtooth', 0.06); setTimeout(() => beep(500, 0.3, 'sawtooth', 0.05), 80); buzz(30);
    const smoke = this.add.particles(0, 0, 'spark', { speed: { min: 40 * D, max: 160 * D }, angle: { min: 240, max: 300 }, lifespan: 700, scale: { start: 0.9 * D, end: 0 }, alpha: { start: 0.7, end: 0 }, tint: [0xdfe6f5, 0x9aa6c2], emitting: false }).setDepth(60);
    smoke.explode(30, this.ventBtn.x, this.ventBtn.y);
    this.time.delayedCall(800, () => smoke.destroy());
    this.refreshPhase();
  }

  refreshPhase() {
    const canVent = state.phase === 'build' && state.pressure > 0;
    this.ventBtn.setAlpha(canVent ? (state.res.money >= RULES.ventCost ? 1 : 0.5) : 0.25);
    const build = state.phase === 'build';
    this.goBtn.setVisible(build || this.canFinish());
    this.goBtn.label.setText(build ? '▶  Başlat' : `✓ Bitir +${this.earlyBonus()} ●`);
    this.slots.forEach(s => { s.vis.setAlpha(build && state.places > 0 ? 1 : 0.35); s.name.setAlpha(build && state.places > 0 ? 1 : 0.35); s.recipe.setAlpha(s.name.alpha); });
    if (build) {
      const n = state.grid.filter(Boolean).length;
      this.hint.setText(state.places > 0
        ? `${state.places} yerleştirme hakkın var`
        : (n ? 'Hakların bitti. Taşıyabilir ya da başlatabilirsin.' : ''));
      this.goBtn.setAlpha(n ? 1 : 0.45);
    } else if (state.phase === 'run') {
      this.hint.setText('! çıkan makineye dokun, bakımını yap.');
    }
    this.updateHud(true);
    this.tutorial();
  }

  // ---------- açıklama kartı ----------
  setBanner(title, body, accent) {
    const { w, h } = this.bannerSize, g = this.bannerG;
    g.clear();
    g.fillStyle(0x000000, 0.35).fillRoundedRect(0, 4 * D, w, h, 16 * D);
    g.fillStyle(0x232c4a, 0.97).fillRoundedRect(0, 0, w, h, 16 * D);
    g.lineStyle(2 * D, accent || C.brass, 1).strokeRoundedRect(0, 0, w, h, 16 * D);
    this.bannerT1.setText(title);
    this.bannerT2.setText(body);
    this.banner.setVisible(true);
  }
  showInfo(type) {
    const m = MACHINES[type], info = INFO[type];
    this.setBanner(info.title + '   ' + info.recipe, info.body, m.color);
    this.infoUntil = this.time.now + 2800;
  }
  tutorial() {
    // ilk turda adım adım yol göster
    this.slots.forEach(s => s.ring.setVisible(false));
    this.goRing.setVisible(false);
    if (this.infoUntil && this.time.now < this.infoUntil) return;
    if (state.round !== 0 || state.tutorialDone) {
      this.banner.setVisible(false);
      return;
    }
    const has = t => state.grid.includes(t);
    if (state.phase === 'build') {
      if (!has('crank')) {
        this.setBanner('1 / 3   Önce bir Krank koy', 'Krank enerji ⚡ üretir. Diğer makineler enerjiyle çalışır.', MACHINES.crank.color);
        this.slots[0].ring.setVisible(true);
      } else if (!has('press')) {
        this.setBanner('2 / 3   Şimdi bir Pres koy', 'Pres enerjiyi ⚡ kıvılcıma ✦ çevirir. Hedef kıvılcımdır!', MACHINES.press.color);
        this.slots[1].ring.setVisible(true);
      } else {
        this.setBanner('3 / 3   Hazırsın! ▶ Başlat\'a bas', 'Kalan hakkınla bir Pres daha koyabilirsin. 60 saniyede ✦ 30 topla.', 0x5fd38a);
        this.goRing.setVisible(true);
      }
    } else if (state.phase === 'run') {
      if (state.time > RULES.roundTime - 8) {
        this.setBanner('⚡ Krank\'tan Pres\'e enerji akıyor', 'Pres her enerjiyi ✦ kıvılcıma çeviriyor. Makinelerde ! çıkınca dokun, bakım yap.', MACHINES.press.color);
      } else {
        this.banner.setVisible(false);
        state.tutorialDone = true;
      }
    }
  }

  // ---------- tur akışı ----------
  canFinish() { return state.phase === 'run' && state.res.spark >= RULES.goals[state.round]; }
  earlyBonus() { return Math.floor(Math.max(0, state.time) / RULES.bonusEvery); }
  finishEarly() {
    if (!this.canFinish()) return;
    const bonus = this.earlyBonus();
    state.res.money += bonus;
    this.endRound(bonus);
  }

  startRound() {
    if (state.phase !== 'build') return;
    if (!state.grid.some(Boolean)) { this.cameras.main.shake(80, 0.004); sfx.bad(); return; }
    state.phase = 'run';
    state.time = RULES.roundTime;
    state.res.spark = 0;
    state.res.energy = 0;
    state.roundTime0 = state.time;
    this.lastRequestAt = -99;
    // makineleri karışık sırayla, aralıklı zamanlara yay
    const list = Phaser.Utils.Array.Shuffle(this.cells.filter(Boolean));
    list.forEach((v, k) => { v.t = 0; v.boost = null; this.resetService(v); v.needIn = 3 + k * RULES.startStagger + Phaser.Math.FloatBetween(0, 1.5); });
    beep(392, 0.12, 'triangle', 0.2); setTimeout(() => beep(523, 0.12, 'triangle', 0.2), 110); setTimeout(() => beep(784, 0.2, 'triangle', 0.2), 220);
    buzz(30);
    this.refreshPhase();
  }

  endRound(bonus = 0) {
    if (this.mg) { this.mg.panel.destroy(); this.mg = null; }
    this.cells.forEach(v => { if (v) { this.setAlert(v, null); v.setAlpha(1); v.svc = 'ok'; } });
    const goal = RULES.goals[state.round];
    const won = state.res.spark >= goal;
    const before = state.pressure;
    if (won) state.pressure = Math.max(0, state.pressure - RULES.pressWinDrop);
    else state.pressure += (1 - state.res.spark / goal) * RULES.pressMiss;
    const delta = Math.round(state.pressure - before);
    state.phase = 'end';
    state.result = { won, spark: state.res.spark, goal, bonus, delta, last: state.round === RULES.goals.length - 1 };
    if (state.pressure >= 100) { this.explode(); return; }
    this.refreshPhase();
    this.showResult();
    if (won) { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.14, 'triangle', 0.2), i * 100)); buzz([20, 40, 20]); }
    else { beep(220, 0.3, 'sawtooth', 0.15); setTimeout(() => beep(150, 0.4, 'sawtooth', 0.15), 200); buzz(120); }
  }

  // ---------- patlama ----------
  explode() {
    if (this.boomed) return;
    this.boomed = true;
    if (this.mg) { this.mg.panel.destroy(); this.mg = null; }
    state.phase = 'boom';
    state.pressure = 100;
    this.cells.forEach(v => { if (v) this.setAlert(v, null); });
    this.banner.setVisible(false); this.infoUntil = 0;
    state.result = Object.assign(state.result || {}, { boom: true, round: state.round });
    this.updateHud(true);
    this.refreshPhase();
    const W = this.W, H = this.H;
    // önce titreme ve siren, sonra BUM
    this.cells.forEach(v => { if (v) this.tweens.add({ targets: v, x: v.x + 3 * D, duration: 40, yoyo: true, repeat: 8 }); });
    [880, 660, 880, 660].forEach((f, k) => setTimeout(() => beep(f, 0.12, 'square', 0.12), k * 130));
    this.cameras.main.shake(600, 0.004);
    this.time.delayedCall(600, () => {
      boomSound(); buzz([200, 60, 300]);
      this.cameras.main.shake(700, 0.03);
      const flash = this.add.rectangle(0, 0, W, H, 0xfff2c4, 1).setOrigin(0).setDepth(95);
      this.tweens.add({ targets: flash, alpha: 0, duration: 500, onComplete: () => flash.destroy() });
      const cx = this.gx + this.cell * COLS / 2, cy = this.gy + this.cell * ROWS / 2;
      if (!this.textures.exists('smoke')) {
        const t = this.make.graphics({ add: false });
        t.fillStyle(0xffffff, 1).fillCircle(32, 32, 32);
        t.generateTexture('smoke', 64, 64); t.destroy();
      }
      const fire = this.add.particles(0, 0, 'spark', {
        speed: { min: 200 * D, max: 900 * D }, angle: { min: 0, max: 360 }, lifespan: 900,
        scale: { start: 1.4 * D, end: 0 }, tint: [0xffd84a, 0xff8a3c, 0xffffff, 0xe0564a], gravityY: 500 * D,
        blendMode: 'ADD', emitting: false,
      }).setDepth(92);
      const smoke = this.add.particles(0, 0, 'smoke', {
        speed: { min: 30 * D, max: 160 * D }, angle: { min: 0, max: 360 }, lifespan: 1800,
        scale: { start: 0.6 * D, end: 2.2 * D }, alpha: { start: 0.5, end: 0 }, tint: [0x3a3f52, 0x55596b, 0x2a2e3c],
        emitting: false,
      }).setDepth(91);
      fire.explode(120, cx, cy);
      this.cells.forEach((v, i) => {
        if (!v) return;
        fire.explode(14, v.x, v.y); smoke.explode(4, v.x, v.y);
        const a = Math.atan2(v.y - cy, v.x - cx) + Phaser.Math.FloatBetween(-0.5, 0.5);
        const dist = Phaser.Math.FloatBetween(0.6, 1.1) * Math.max(W, H);
        this.tweens.add({ targets: v, x: v.x + Math.cos(a) * dist, y: v.y + Math.sin(a) * dist - H * 0.2, angle: Phaser.Math.Between(-540, 540), scale: 1.4, duration: 1100, ease: 'Quad.easeOut' });
      });
      smoke.explode(18, cx, cy);
      this.gridG.setAlpha(0.5);
      this.time.delayedCall(1500, () => this.showResult());
    });
  }

  showResult() {
    const W = this.W, H = this.H, R = state.result;
    const k = this.add.container(0, 0).setDepth(100);
    const dim = this.add.rectangle(0, 0, W, H, 0x05070d, 0.72).setOrigin(0).setInteractive();
    const cw = Math.min(W - this.pad * 2, 360 * D), ch = cw * 0.82;
    const cx = W / 2, cy = H * 0.45;
    const good = R.won && !R.boom;
    const g = this.add.graphics();
    g.fillStyle(C.copperDark, 1).fillRoundedRect(cx - cw / 2, cy - ch / 2 + 6 * D, cw, ch, 22 * D);
    g.fillStyle(0x1d2540, 1).fillRoundedRect(cx - cw / 2, cy - ch / 2, cw, ch, 22 * D);
    g.lineStyle(3 * D, good ? 0x5fd38a : R.boom ? 0xff8a3c : 0xe0564a, 1).strokeRoundedRect(cx - cw / 2, cy - ch / 2, cw, ch, 22 * D);
    let title, big, sub, label, style;
    if (R.boom) {
      title = 'FABRİKA PATLADI!';
      big = `Tur ${R.round + 1} / ${RULES.goals.length}`;
      sub = R.round === 0 ? 'Bozuk makineleri bekletme, basınç birikir.\nFan komşularının basıncını azaltır.' : `${R.round} tur dayandın. Bir dahakine daha uzun!`;
      label = 'Yeniden kur'; style = BTN_BRASS;
    } else if (R.last) {
      title = R.won ? 'Fabrika ayakta!' : 'Zor da olsa ayakta!';
      big = `✦ ${R.spark} / ${R.goal}`;
      sub = `Prototipin ${RULES.goals.length} turunu patlamadan bitirdin.\nSon basınç: %${Math.round(state.pressure)}`;
      label = 'Yeniden başla'; style = BTN_GO;
    } else {
      title = R.won ? 'Hedef tuttu!' : 'Hedef tutmadı';
      big = `✦ ${R.spark} / ${R.goal}`;
      const p = R.delta > 0 ? `Basınç +%${R.delta}  ▲` : R.delta < 0 ? `Basınç %${-R.delta} azaldı  ▼` : '';
      sub = (R.bonus ? `Erken bitirme bonusu: +${R.bonus} ●\n` : '') + (p ? p + '\n' : '') + `Sonraki hedef: ✦ ${RULES.goals[state.round + 1]}  ·  +${RULES.placesPerRound} hak`;
      label = 'Sonraki tur  ▶'; style = R.won ? BTN_GO : BTN_BRASS;
    }
    const t1 = this.add.text(cx, cy - ch * 0.32, title, { fontFamily: FONT, fontSize: Math.round(cw * (R.boom ? 0.088 : 0.1)) + 'px', fontStyle: '700', color: good ? '#7fe3a5' : R.boom ? '#ffb36b' : '#ff8a7c' }).setOrigin(0.5);
    const t2 = this.add.text(cx, cy - ch * 0.13, big, { fontFamily: FONT, fontSize: Math.round(cw * 0.08) + 'px', fontStyle: '700', color: '#ffd84a' }).setOrigin(0.5);
    const t3 = this.add.text(cx, cy + ch * 0.1, sub, { fontFamily: FONT, fontSize: Math.round(cw * 0.045) + 'px', fontStyle: '500', color: C.dim, align: 'center', lineSpacing: 4 * D }).setOrigin(0.5);
    const btn = makeButton(this, cx, cy + ch * 0.37, cw * 0.7, Math.min(ch * 0.19, 56 * D), label, style, () => this.afterResult());
    k.add([dim, g, t1, t2, t3, btn]);
    k.setAlpha(0); this.tweens.add({ targets: k, alpha: 1, duration: 200 });
    this.resultBox = k;
  }

  afterResult() {
    const R = state.result;
    if (!R.boom && !R.last) {
      state.round++;
      state.phase = 'build';
      state.places += RULES.placesPerRound;
      state.res.spark = 0;
      state.res.energy = 0;
      state.time = RULES.roundTime;
      state.result = null;
      this.resultBox.destroy();
      this.refreshPhase();
      if (state.pressure >= 30 && !state.ventTaught) {
        state.ventTaught = true;
        this.flashTip('Basınç yüksek mi? Tahliye et!', `Sağ üstteki mavi vana ${RULES.ventCost} ● karşılığında basıncı %${RULES.ventDrop} düşürür. Mükemmel bakımlar da basıncı azaltır.`, 0x8fb4ff, 6000);
      }
    } else {
      newRun();
      this.boomed = false;
      this.scene.restart();
    }
  }

  // ---------- basınç ----------
  tickPressure(dt) {
    let gain = 0;
    this.cells.forEach((v, i) => {
      if (!v) return;
      let g = v.svc === 'broken' ? RULES.pressBroken : v.svc === 'need' ? RULES.pressNeed : 0;
      if (g && v.type !== 'fan' && this.hasCoolFan(i)) g *= RULES.fanCool;
      gain += g;
    });
    if (gain > 0 && !state.pressureTaught) {
      state.pressureTaught = true;
      this.flashTip('▲ Basınç yükseliyor!', 'Bakım bekleyen ve bozuk makineler basınç yapar. %100 olursa fabrika patlar!', 0xff8a3c, 4500);
    }
    if (gain === 0 && !this.mg) state.pressure = Math.max(0, state.pressure - RULES.pressCalm * dt);
    state.pressure = Math.min(100, state.pressure + gain * dt);
    if (state.pressure >= 100) this.explode();
  }
  hasCoolFan(i) {
    const c0 = i % COLS, r0 = Math.floor(i / COLS);
    return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
      const c = c0 + dx, r = r0 + dy;
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
      const n = this.cells[r * COLS + c];
      return n && n.type === 'fan' && n.svc !== 'broken';
    });
  }
  drawDanger(dtMs) {
    const p = state.pressure, g = this.dangerG;
    g.clear();
    if (p < 65 || state.phase !== 'run') return;
    this.dangerT = (this.dangerT || 0) + dtMs * (p > 85 ? 0.012 : 0.007);
    const a = (0.25 + 0.25 * Math.sin(this.dangerT)) * ((p - 60) / 40);
    const w = 18 * D;
    g.fillStyle(0xe0564a, a);
    g.fillRect(0, 0, this.W, w); g.fillRect(0, this.H - w, this.W, w);
    g.fillRect(0, 0, w, this.H); g.fillRect(this.W - w, 0, w, this.H);
    const beat = Math.floor(this.dangerT / Math.PI);
    if (beat !== this.lastBeat) { this.lastBeat = beat; if (beat % 2 === 0) { beep(p > 85 ? 980 : 740, 0.08, 'square', 0.07); buzz(10); } }
  }

  // ---------- üretim ----------
  produce(i, v, fromTap) {
    const p = PROD[v.type];
    if (!p.out) return false;
    if (p.cost && state.res[p.cost] < 1) { v.stalled = true; return false; }
    if (p.cost) { state.res[p.cost] -= 1; this.flowEnergy(i); }
    state.res[p.out] += 1;
    v.stalled = false;
    const c = this.cellCenter(i);
    const pop = this.add.text(c.x, c.y - this.cell * 0.3, `+1 ${RES[p.out].sym}`, {
      fontFamily: FONT, fontSize: Math.round(this.cell * (fromTap ? 0.26 : 0.2)) + 'px', fontStyle: '700', color: RES[p.out].color,
      stroke: '#0b0f1c', strokeThickness: 4 * D,
    }).setOrigin(0.5).setDepth(60);
    this.tweens.add({ targets: pop, y: pop.y - this.cell * 0.45, alpha: 0, duration: 650, ease: 'Quad.easeOut', onComplete: () => pop.destroy() });
    if (!fromTap) {
      this.tweens.add({ targets: v, scaleY: 0.93, scaleX: 1.04, duration: 60, yoyo: true });
      if (p.out === 'spark') beep(980, 0.04, 'square', 0.05);
    }
    return true;
  }

  // =====================================================================
  // BAKIM VE MİNİ OYUNLAR
  // =====================================================================
  resetService(v) {
    v.svc = 'ok';
    const [a, b] = RULES.wear[v.type];
    v.needIn = Phaser.Math.FloatBetween(a, b);
    v.brokeIn = RULES.breakAfter;
    this.setAlert(v, null);
  }

  setAlert(v, kind) {
    if (v.alert) { v.alert.destroy(); v.alert = null; }
    if (!kind) return;
    const s = this.cell;
    const a = this.add.container(v.x + s * 0.3, v.y - s * 0.36).setDepth(45);
    const g = this.add.graphics();
    const col = kind === 'broken' ? 0xe0564a : 0xffc23d;
    g.fillStyle(0x000000, 0.35).fillCircle(0, 2 * D, s * 0.17);
    g.fillStyle(col, 1).fillCircle(0, 0, s * 0.17);
    g.lineStyle(2 * D, 0x2a1405, 1).strokeCircle(0, 0, s * 0.17);
    const t = this.add.text(0, 0, kind === 'broken' ? '✕' : '!', { fontFamily: FONT, fontSize: Math.round(s * 0.24) + 'px', fontStyle: '700', color: '#2a1405' }).setOrigin(0.5);
    a.add([g, t]);
    this.tweens.add({ targets: a, y: a.y - s * 0.06, duration: kind === 'broken' ? 180 : 320, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    v.alert = a;
  }

  tickService(v, i, dt) {
    if (this.mg) return; // mini oyun açıkken diğer makineler bekler
    if (v.svc === 'ok') {
      v.needIn -= dt;
      if (v.needIn <= 0) {
        // aynı anda çok fazla uyarı olmasın: sınır doluysa ya da az önce uyarı geldiyse biraz beklet
        const n = this.cells.filter(Boolean).length;
        const cap = Math.max(1, Math.ceil(n / RULES.maxRequestsPer));
        const open = this.cells.filter(c => c && c.svc !== 'ok').length;
        const since = (state.roundTime0 - state.time) - (this.lastRequestAt ?? -99);
        if (open >= cap || since < RULES.requestGap) { v.needIn = Phaser.Math.FloatBetween(0.8, 2.2); return; }
        this.lastRequestAt = state.roundTime0 - state.time;
        v.svc = 'need'; v.brokeIn = RULES.breakAfter;
        this.setAlert(v, 'need');
        beep(660, 0.06, 'triangle', 0.12); setTimeout(() => beep(660, 0.06, 'triangle', 0.12), 120);
        buzz(15);
        if (!state.serviceTaught) this.flashTip('Makine bakım istiyor!', '! işaretli makineye dokun ve mini oyunu oyna. Yoksa birkaç saniye sonra durur.', 0xffc23d, 5000, () => { state.serviceTaught = true; });
      }
    } else if (v.svc === 'need') {
      v.brokeIn -= dt;
      if (v.brokeIn <= 0) {
        v.svc = 'broken';
        this.setAlert(v, 'broken');
        beep(120, 0.25, 'sawtooth', 0.12); buzz(60);
        this.cameras.main.shake(100, 0.003);
      }
    }
  }

  speedOf(v) {
    if (v.svc === 'broken') return 0;
    let m = 1;
    if (v.boost && state.time > v.boost.until) m *= v.boost.mult; // süre geri sayıyor: time > until iken aktif
    return m;
  }

  flashTip(title, body, accent, ms, done) {
    this.setBanner(title, body, accent);
    this.infoUntil = this.time.now + ms;
    if (done) this.time.delayedCall(ms, done);
  }

  // ---------- mini oyun paneli ----------
  openMinigame(i) {
    if (this.mg) return;
    const v = this.cells[i];
    const W = this.W, s = this.cell;
    const pw = W - this.pad * 2, ph = Math.min(s * 2.9, 290 * D);
    const mc = this.cellCenter(i);
    const gridMid = this.gy + s * ROWS / 2;
    let py = mc.y < gridMid ? mc.y + s * 0.62 : mc.y - s * 0.62 - ph;
    py = Phaser.Math.Clamp(py, 8 * D, this.trayTop - ph - 8 * D);
    const panel = this.add.container(this.pad, py).setDepth(80);
    const g = this.add.graphics();
    const m = MACHINES[v.type];
    // ok ucu makineye
    const tipX = mc.x - this.pad, up = mc.y < py;
    g.fillStyle(0x2a3456, 1);
    if (up) g.fillTriangle(tipX - 14 * D, 2, tipX + 14 * D, 2, tipX, -14 * D);
    else g.fillTriangle(tipX - 14 * D, ph - 2, tipX + 14 * D, ph - 2, tipX, ph + 14 * D);
    g.fillStyle(0x000000, 0.4).fillRoundedRect(0, 6 * D, pw, ph, 20 * D);
    g.fillStyle(0x232c4a, 1).fillRoundedRect(0, 0, pw, ph, 20 * D);
    g.lineStyle(3 * D, 0x2a3456, 1).strokeRoundedRect(0, 0, pw, ph, 20 * D);
    g.lineStyle(2 * D, m.color, 0.9).strokeRoundedRect(3 * D, 3 * D, pw - 6 * D, ph - 6 * D, 17 * D);
    const title = this.add.text(16 * D, 20 * D, MG_TEXT[v.type], { fontFamily: FONT, fontSize: Math.round(Math.min(W * 0.042, 17 * D)) + 'px', fontStyle: '700', color: '#ffe3a8' }).setOrigin(0, 0.5);
    const timer = this.add.graphics();
    panel.add([g, title, timer]);
    const mg = {
      i, v, type: v.type, panel, pw, ph, timer, t: 0, limit: RULES.mgTime, done: false,
      cx: pw / 2, cy: ph * 0.58, gfx: this.add.graphics(), parts: {},
      local: (p) => ({ x: p.x - this.pad, y: p.y - py }),
    };
    panel.add(mg.gfx);
    this.mg = mg;
    panel.setScale(0.85).setAlpha(0);
    this.tweens.add({ targets: panel, scale: 1, alpha: 1, duration: 120, ease: 'Back.easeOut' });
    sfx.pick();
    this['mgInit_' + v.type](mg);
  }

  closeMinigame(grade) {
    const mg = this.mg; if (!mg || mg.done) return;
    mg.done = true;
    (window.__grades = window.__grades || []).push(mg.type + ':' + grade + '@' + mg.t.toFixed(2));
    const v = mg.v, i = mg.i;
    // sonuç
    const R = GRADES[grade];
    const c = this.cellCenter(i);
    const pop = this.add.text(c.x, c.y - this.cell * 0.2, R.label, {
      fontFamily: FONT, fontSize: Math.round(this.cell * (grade === 'perfect' ? 0.36 : 0.28)) + 'px', fontStyle: '700', color: R.color,
      stroke: '#0b0f1c', strokeThickness: 5 * D,
    }).setOrigin(0.5).setDepth(90).setScale(0.4);
    this.tweens.add({ targets: pop, scale: 1, duration: 160, ease: 'Back.easeOut' });
    this.tweens.add({ targets: pop, y: pop.y - this.cell * 0.6, alpha: 0, delay: 650, duration: 400, onComplete: () => pop.destroy() });
    if (grade === 'perfect') {
      [784, 988, 1318].forEach((f, k) => setTimeout(() => beep(f, 0.09, 'triangle', 0.2), k * 60));
      buzz([15, 30, 25]); this.cameras.main.shake(90, 0.005);
      this.sparks.explode(26, c.x, c.y);
    } else if (grade === 'good') { beep(660, 0.1, 'triangle', 0.18); buzz(15); this.sparks.explode(10, c.x, c.y); }
    else { beep(200, 0.15, 'sawtooth', 0.1); buzz([10, 30, 10]); }

    this.resetService(v);
    const relief = grade === 'perfect' ? RULES.pressPerfect : grade === 'good' ? RULES.pressGood : 0;
    if (relief && state.pressure > 0) {
      state.pressure = Math.max(0, state.pressure - relief);
      const pt = this.add.text(this.pbar.x + this.pbar.w * 0.5, this.pbar.y + this.pbar.h / 2, `▼ %${relief}`, { fontFamily: FONT, fontSize: Math.round(this.pbar.h * 0.9) + 'px', fontStyle: '700', color: '#7fe3a5', stroke: '#0b0f1c', strokeThickness: 3 * D }).setOrigin(0.5).setDepth(60);
      this.tweens.add({ targets: pt, y: pt.y + 24 * D, alpha: 0, duration: 800, onComplete: () => pt.destroy() });
    }
    const applyBoost = (target) => { if (R.mult > 1) target.boost = { mult: R.mult, until: state.time - R.secs }; };
    if (v.type === 'fan') {
      // fan: komşularını hızlandırır
      const c0 = i % COLS, r0 = Math.floor(i / COLS);
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const cc = c0 + dx, rr = r0 + dy;
        if (cc < 0 || cc >= COLS || rr < 0 || rr >= ROWS) return;
        const n = this.cells[rr * COLS + cc];
        if (n && R.mult > 1) { applyBoost(n); const nc = this.cellCenter(rr * COLS + cc); this.sparks.explode(8, nc.x, nc.y); }
      });
    } else applyBoost(v);

    const panel = mg.panel;
    this.tweens.add({ targets: panel, alpha: 0, scale: 0.9, duration: 140, delay: 120, onComplete: () => panel.destroy() });
    this.mg = null;
  }

  mgUpdate(dt) {
    const mg = this.mg; if (!mg) return;
    mg.t += dt;
    const f = Math.max(0, 1 - mg.t / mg.limit);
    const tg = mg.timer; tg.clear();
    tg.fillStyle(0x0b0f1c, 1).fillRoundedRect(mg.pw - 16 * D - mg.pw * 0.3, 14 * D, mg.pw * 0.3, 10 * D, 5 * D);
    tg.fillStyle(f > 0.35 ? 0x5fd38a : 0xe0564a, 1).fillRoundedRect(mg.pw - 16 * D - mg.pw * 0.3, 14 * D, Math.max(10 * D, mg.pw * 0.3 * f), 10 * D, 5 * D);
    this['mgStep_' + mg.type](mg, dt);
    if (this.mg === mg && mg.t >= mg.limit) this.closeMinigame('bad');
  }
  grade(mg, perfectT, goodT) { return mg.t <= perfectT ? 'perfect' : mg.t <= goodT ? 'good' : 'bad'; }

  // --- Krank: dönen kol yeşil bölgeden geçerken dokun (tek dokunuş) ---
  mgInit_crank(mg) {
    mg.R = Math.min(mg.ph * 0.3, mg.pw * 0.25);
    mg.dir = Math.random() < 0.5 ? 1 : -1;
    mg.zone = Phaser.Math.FloatBetween(0, Math.PI * 2);   // yeşil bölgenin ortası
    mg.angle = mg.zone + Math.PI;                           // kol karşıdan başlar
    mg.speed = Math.PI * 2 / 1.25;                          // 1.25 sn'de bir tur
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'Kol yeşilden geçerken dokun', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_crank(mg, dt) {
    mg.angle += mg.dir * mg.speed * dt;
    const g = mg.gfx, R = mg.R, rr = R * 0.7;
    g.clear();
    g.fillStyle(C.brassDark, 1).fillCircle(mg.cx, mg.cy + 3 * D, R);
    g.fillStyle(C.brass, 1).fillCircle(mg.cx, mg.cy, R);
    g.fillStyle(C.brassHi, 0.4).fillCircle(mg.cx - R * 0.2, mg.cy - R * 0.25, R * 0.6);
    g.fillStyle(0x10162a, 1).fillCircle(mg.cx, mg.cy, R * 0.88);
    // yeşil bölge (geniş: iyi, dar: mükemmel)
    const arc = (half, col, w) => { g.lineStyle(w, col, 1); g.beginPath(); g.arc(mg.cx, mg.cy, rr, mg.zone - half, mg.zone + half, false); g.strokePath(); };
    arc(0.42, 0x2e8a52, R * 0.26);
    arc(0.16, 0x7fe3a5, R * 0.26);
    // kol
    const hx = mg.cx + Math.cos(mg.angle) * rr, hy = mg.cy + Math.sin(mg.angle) * rr;
    g.lineStyle(R * 0.12, C.copperDark, 1).lineBetween(mg.cx, mg.cy, hx, hy);
    g.fillStyle(C.copper, 1).fillCircle(mg.cx, mg.cy, R * 0.14);
    g.fillStyle(C.copperDark, 1).fillCircle(hx, hy + 2 * D, R * 0.18);
    g.fillStyle(C.copperHi, 1).fillCircle(hx, hy, R * 0.18);
  }
  mgDown_crank(mg) {
    const d = Math.abs(Phaser.Math.Angle.Wrap(mg.angle - mg.zone));
    this.closeMinigame(d < 0.16 ? 'perfect' : d < 0.42 ? 'good' : 'bad');
  }

  // --- Pres: ritim çubuğu ---
  mgInit_press(mg) {
    mg.bw = mg.pw * 0.8; mg.bx = (mg.pw - mg.bw) / 2; mg.bh = Math.min(44 * D, mg.ph * 0.2);
    mg.zone = Phaser.Math.FloatBetween(0.28, 0.72);
    mg.speed = 1 / 1.1; mg.pos = 0;
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'İbre yeşil bölgedeyken dokun', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_press(mg) {
    mg.pos = (Math.sin(mg.t * Math.PI * 2 * mg.speed - Math.PI / 2) + 1) / 2;
    const g = mg.gfx, y = mg.cy - mg.bh / 2;
    g.clear();
    g.fillStyle(0x0b0f1c, 1).fillRoundedRect(mg.bx, y, mg.bw, mg.bh, mg.bh * 0.3);
    g.fillStyle(0x2e8a52, 1).fillRect(mg.bx + mg.bw * (mg.zone - 0.12), y + 4 * D, mg.bw * 0.24, mg.bh - 8 * D);
    g.fillStyle(0x7fe3a5, 1).fillRect(mg.bx + mg.bw * (mg.zone - 0.045), y + 4 * D, mg.bw * 0.09, mg.bh - 8 * D);
    const nx = mg.bx + mg.bw * mg.pos;
    g.fillStyle(0xffd84a, 1).fillTriangle(nx - 10 * D, y - 14 * D, nx + 10 * D, y - 14 * D, nx, y + 2 * D);
    g.fillStyle(0xffffff, 1).fillRect(nx - 2 * D, y, 4 * D, mg.bh);
  }
  mgDown_press(mg) {
    const d = Math.abs(mg.pos - mg.zone);
    this.closeMinigame(d < 0.045 ? 'perfect' : d < 0.12 ? 'good' : 'bad');
  }

  // --- Basıcı: basılı tut, basıncı doldur, yeşilde bırak ---
  mgInit_mint(mg) {
    mg.gh = mg.ph * 0.5; mg.gw = 34 * D; mg.gx = mg.cx - mg.pw * 0.12; mg.gy = mg.cy - mg.gh / 2 - 8 * D;
    mg.zone = Phaser.Math.FloatBetween(0.55, 0.82); mg.level = 0; mg.hold = false; mg.tick = 0;
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'Basılı tut, yeşilde bırak', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_mint(mg, dt) {
    if (mg.hold) {
      mg.level += dt * (0.3 + mg.level * 0.8);   // giderek hızlanır
      mg.tick -= dt;
      if (mg.tick <= 0) { mg.tick = 0.06; beep(200 + mg.level * 700, 0.03, 'sawtooth', 0.06); }
      if (mg.level >= 1) { mg.level = 1; this.cameras.main.shake(120, 0.006); this.closeMinigame('bad'); return; }
    } else if (mg.level > 0 && !mg.released) mg.level = Math.max(0, mg.level - dt * 0.8);
    const g = mg.gfx, x = mg.gx, y = mg.gy, w = mg.gw, h = mg.gh, lv = mg.level;
    g.clear();
    // gösterge
    g.fillStyle(0x0b0f1c, 1).fillRoundedRect(x - w / 2, y, w, h, w / 2);
    const zy = (f) => y + h * (1 - f);
    g.fillStyle(0x2e8a52, 1).fillRect(x - w / 2 + 4 * D, zy(mg.zone + 0.08), w - 8 * D, h * 0.16);
    g.fillStyle(0x7fe3a5, 1).fillRect(x - w / 2 + 4 * D, zy(mg.zone + 0.03), w - 8 * D, h * 0.06);
    g.fillStyle(0xe0564a, 0.5).fillRect(x - w / 2 + 4 * D, zy(1), w - 8 * D, h * 0.06);
    if (lv > 0) {
      const col = lv > mg.zone + 0.08 ? 0xe0564a : 0x7fd47a;
      g.fillStyle(col, 0.9).fillRoundedRect(x - w * 0.18, zy(lv), w * 0.36, h * lv, w * 0.18);
    }
    g.fillStyle(0xffffff, 1).fillTriangle(x + w / 2 + 2 * D, zy(lv), x + w / 2 + 14 * D, zy(lv) - 8 * D, x + w / 2 + 14 * D, zy(lv) + 8 * D);
    // kol (basınca aşağı iner)
    const bx = mg.cx + mg.pw * 0.14, by = mg.cy, L = mg.ph * 0.3;
    const ang = -0.9 + lv * 1.5;
    const ex = bx + Math.cos(ang) * L, ey = by + Math.sin(ang) * L;
    g.fillStyle(C.copperDark, 1).fillRoundedRect(bx - 20 * D, by - 14 * D, 40 * D, 40 * D, 8 * D);
    g.lineStyle(8 * D, C.copperDark, 1).lineBetween(bx, by, ex, ey);
    g.fillStyle(C.brassDark, 1).fillCircle(ex, ey + 3 * D, 16 * D);
    g.fillStyle(mg.hold ? C.brassHi : C.brass, 1).fillCircle(ex, ey, 16 * D);
    g.fillStyle(C.copper, 1).fillCircle(bx, by, 9 * D);
  }
  mgDown_mint(mg) { if (!mg.released) mg.hold = true; }
  mgUp_mint(mg) {
    if (!mg.hold) return;
    mg.hold = false; mg.released = true;
    const d = mg.level - mg.zone;
    beep(320, 0.08, 'square', 0.2); setTimeout(() => beep(900, 0.06, 'triangle', 0.15), 50);
    this.closeMinigame(Math.abs(d) < 0.035 ? "perfect" : Math.abs(d) < 0.09 ? "good" : "bad");
  }

  // --- Fan: 5 hızlı dokunuş ---
  mgInit_fan(mg) {
    mg.taps = 0; mg.need = 5; mg.spin = 0; mg.rot = 0;
    mg.hint = this.add.text(mg.cx, mg.ph - 18 * D, 'Hızlıca 5 kez dokun', { fontFamily: FONT, fontSize: Math.round(14 * D) + 'px', color: C.dim }).setOrigin(0.5);
    mg.panel.add(mg.hint);
  }
  mgStep_fan(mg, dt) {
    mg.spin = Math.max(0, mg.spin - dt * 6); mg.rot += (1 + mg.spin * 3) * dt * 4;
    const g = mg.gfx, R = Math.min(mg.ph * 0.3, mg.pw * 0.25);
    g.clear();
    g.fillStyle(C.brassDark, 1).fillCircle(mg.cx, mg.cy + 3 * D, R);
    g.fillStyle(C.brass, 1).fillCircle(mg.cx, mg.cy, R);
    g.fillStyle(0x10162a, 1).fillCircle(mg.cx, mg.cy, R * 0.86);
    for (let k = 0; k < 4; k++) {
      const a = mg.rot + k * Math.PI / 2;
      g.fillStyle(0x8fb4ff, 1).fillTriangle(mg.cx, mg.cy, mg.cx + Math.cos(a - 0.35) * R * 0.78, mg.cy + Math.sin(a - 0.35) * R * 0.78, mg.cx + Math.cos(a + 0.45) * R * 0.78, mg.cy + Math.sin(a + 0.45) * R * 0.78);
    }
    g.fillStyle(C.brass, 1).fillCircle(mg.cx, mg.cy, R * 0.16);
    // dokunuş noktaları
    for (let k = 0; k < mg.need; k++) {
      const x = mg.cx + (k - (mg.need - 1) / 2) * 22 * D, y = mg.cy + R + 18 * D;
      g.fillStyle(k < mg.taps ? 0x8fb4ff : 0x2a3456, 1).fillCircle(x, y, 7 * D);
    }
  }
  mgDown_fan(mg) {
    mg.taps++; mg.spin = 1; beep(500 + mg.taps * 90, 0.05, 'square', 0.12); buzz(8);
    if (mg.taps >= mg.need) this.closeMinigame(this.grade(mg, 1.1, 1.9));
  }

  flowEnergy(to) {
    // en yakın Krank'tan bu makineye uçan ⚡
    let best = -1, bd = 1e9;
    const tc = this.cellCenter(to);
    state.grid.forEach((t, j) => {
      if (t !== 'crank') return;
      const c = this.cellCenter(j), d = (c.x - tc.x) ** 2 + (c.y - tc.y) ** 2;
      if (d < bd) { bd = d; best = j; }
    });
    if (best < 0) return;
    const from = this.cellCenter(best);
    const bolt = this.add.text(from.x, from.y, '⚡', { fontFamily: FONT, fontSize: Math.round(this.cell * 0.24) + 'px', color: '#4fd6e0', stroke: '#0b0f1c', strokeThickness: 3 * D }).setOrigin(0.5).setDepth(55);
    this.tweens.add({ targets: bolt, x: tc.x, y: tc.y, duration: 320, ease: 'Sine.easeIn', onComplete: () => {
      bolt.destroy();
      this.sparks.explode(4, tc.x, tc.y);
    } });
  }

  update(_, dtMs) {
    const dt = dtMs / 1000;
    this.cells.forEach(v => { if (v && v.blades) v.blades.rotation += dtMs * (state.phase === 'run' ? 0.012 : 0.004); });
    this.slots.forEach(s => { if (s.vis.blades) s.vis.blades.rotation += dtMs * 0.003; });
    this.drawDanger(dtMs);
    this.tutT = (this.tutT || 0) + dt;
    if (this.tutT > 0.25) { this.tutT = 0; this.tutorial(); }
    if (state.phase !== 'run') return;

    state.time -= dt;
    // önce üreticiler, sonra tüketiciler
    ['crank', 'press', 'mint'].forEach(type => {
      this.cells.forEach((v, i) => {
        if (!v || v.type !== type) return;
        this.tickService(v, i, dt);
        const sp = this.speedOf(v);
        v.t = (v.t || 0) + dt * sp;
        const every = PROD[type].every;
        if (v.t >= every) { v.t -= every; this.produce(i, v, false); }
        v.setAlpha(v.svc === 'broken' ? 0.45 : v.stalled ? 0.6 : 1);
      });
    });
    this.cells.forEach((v, i) => { if (v && v.type === 'fan') { this.tickService(v, i, dt); v.setAlpha(v.svc === 'broken' ? 0.45 : 1); } });
    this.mgUpdate(dt);
    this.tickPressure(dt);
    if (state.phase !== 'run') return;
    const prev = Math.ceil(state.time + dt);
    if (Math.ceil(state.time) !== prev && state.time <= 5 && state.time > 0) { beep(1200, 0.05, 'square', 0.1); buzz(6); }
    this.updateHud(false);
    const can = this.canFinish();
    if (can !== this.goBtn.visible || (can && (this.lastBonus !== this.earlyBonus()))) {
      if (can && !this.goBtn.visible) { this.hint.setText('Hedef tuttu! Bitir ya da para için devam et.'); beep(880, 0.1, 'triangle', 0.18); buzz(20); this.goBtn.setScale(1.2); this.tweens.add({ targets: this.goBtn, scale: 1, duration: 250, ease: 'Back.easeOut' }); }
      this.lastBonus = this.earlyBonus();
      this.goBtn.setVisible(can).label.setText(`✓ Bitir +${this.lastBonus} ●`);
    }
    if (state.time <= 0) { state.time = 0; this.endRound(); }
  }

  // ---------- yardımcılar ----------
  drawGrid() {
    const g = this.gridG, s = this.cell, gap = Math.max(2, s * 0.04), rr = s * 0.14;
    g.clear();
    const wx = this.gx - 8 * D, wy = this.gy - 8 * D, ww = s * COLS + 16 * D, wh = s * ROWS + 16 * D;
    g.fillStyle(C.copperDark, 1).fillRoundedRect(wx - 3 * D, wy - 3 * D, ww + 6 * D, wh + 6 * D, 18 * D);
    g.fillStyle(C.well, 1).fillRoundedRect(wx, wy, ww, wh, 15 * D);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = this.gx + c * s + gap, y = this.gy + r * s + gap, w = s - gap * 2;
      g.fillStyle(C.cellLo, 1).fillRoundedRect(x, y, w, w, rr);
      g.fillStyle(C.cell, 1).fillRoundedRect(x, y + 2 * D, w, w - 2 * D, rr);
      g.fillStyle(C.cellHi, 0.5).fillRoundedRect(x + w * 0.2, y + w - 4 * D, w * 0.6, 2 * D, 1 * D);
    }
    [[wx + 10 * D, wy + 10 * D], [wx + ww - 10 * D, wy + 10 * D], [wx + 10 * D, wy + wh - 10 * D], [wx + ww - 10 * D, wy + wh - 10 * D]]
      .forEach(([x, y]) => rivet(g, x, y, 3.5 * D));
  }
  cellCenter(i) {
    const c = i % COLS, r = Math.floor(i / COLS);
    return { x: this.gx + c * this.cell + this.cell / 2, y: this.gy + r * this.cell + this.cell / 2 };
  }
  cellAt(x, y) {
    const c = Math.floor((x - this.gx) / this.cell), r = Math.floor((y - this.gy) / this.cell);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
    return r * COLS + c;
  }
  spawnCell(i, type, animate) {
    const p = this.cellCenter(i);
    const v = drawMachine(this, type, this.cell * 0.78).setPosition(p.x, p.y).setDepth(10 + Math.floor(i / COLS));
    v.t = 0; v.cd = 0;
    this.cells[i] = v;
    if (animate) {
      v.y -= this.cell * 0.25; v.setScale(1.15);
      this.tweens.add({ targets: v, y: p.y, scale: 1, duration: 180, ease: 'Bounce.easeOut' });
      this.time.delayedCall(90, () => this.sparks.explode(14, p.x, p.y + this.cell * 0.35));
    }
  }
  ghostY(y) { return y - this.cell * 0.7; }

  // ---------- dokunma ----------
  onDown(p) {
    if (state.phase === 'end' || state.phase === 'boom') return;
    if (this.mg) { const f = this['mgDown_' + this.mg.type]; if (f) f.call(this, this.mg, p); return; }
    if (state.phase === 'build' && state.places > 0 && p.y > this.slotTop) {
      const slot = this.slots.find(s => Math.abs(p.x - s.x) < s.r);
      if (slot) {
        this.startDrag(slot.type, -1, p);
        this.showInfo(slot.type);
        this.tweens.add({ targets: slot.vis, scale: 0.85, duration: 60, yoyo: true });
        return;
      }
    }
    if (p.y > this.slotTop) {
      const slot = this.slots.find(s => Math.abs(p.x - s.x) < s.r);
      if (slot) { this.showInfo(slot.type); return; }
    }
    const i = this.cellAt(p.x, p.y);
    if (i >= 0 && state.grid[i]) this.pending = { i, x: p.x, y: p.y };
  }

  startDrag(type, from, p) {
    const ghost = drawMachine(this, type, this.cell * 0.86).setDepth(30);
    ghost.setPosition(p.x, this.ghostY(p.y));
    this.tweens.add({ targets: ghost, angle: { from: -4, to: 4 }, duration: 260, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.drag = { type, from, ghost };
    if (from >= 0) {
      this.cells[from].destroy();
      this.cells[from] = null;
      state.grid[from] = null;
      this.trashBg.setVisible(true);
      this.trashText.setVisible(true);
    }
    sfx.pick();
    this.updateHighlight(p);
  }

  onMove(p) {
    if (this.mg) { const f = this['mgMove_' + this.mg.type]; if (f) f.call(this, this.mg, p); return; }
    if (this.pending && !this.drag) {
      // makineler yalnızca inşa evresinde taşınır
      if (state.phase === 'build' && Phaser.Math.Distance.Between(p.x, p.y, this.pending.x, this.pending.y) > 10 * D) {
        const { i } = this.pending;
        const type = state.grid[i];
        this.pending = null;
        this.startDrag(type, i, p);
      }
      return;
    }
    if (!this.drag) return;
    this.drag.ghost.setPosition(p.x, this.ghostY(p.y));
    this.updateHighlight(p);
  }

  updateHighlight(p) {
    const g = this.hl; g.clear();
    if (p.y > this.trayTop) return;
    const i = this.cellAt(p.x, this.ghostY(p.y));
    if (i < 0) return;
    const c = i % COLS, r = Math.floor(i / COLS), s = this.cell, gap = Math.max(2, s * 0.04);
    const ok = !state.grid[i];
    g.fillStyle(ok ? C.ok : C.bad, 0.18).fillRoundedRect(this.gx + c * s + gap, this.gy + r * s + gap, s - gap * 2, s - gap * 2, s * 0.14);
    g.lineStyle(3 * D, ok ? C.ok : C.bad, 1).strokeRoundedRect(this.gx + c * s + gap, this.gy + r * s + gap, s - gap * 2, s - gap * 2, s * 0.14);
  }

  onUp(p) {
    if (this.mg) { const f = this['mgUp_' + this.mg.type]; if (f) f.call(this, this.mg, p); return; }
    if (this.pending && !this.drag) {
      const i = this.pending.i, v = this.cells[i];
      this.pending = null;
      if (v) {
        this.tweens.killTweensOf(v); v.setScale(1);
        this.tweens.add({ targets: v, scaleX: 1.1, scaleY: 0.88, duration: 55, yoyo: true });
        this.sparks.explode(10, p.x, p.y);
        sfx.tap();
        if (state.phase === 'run') {
          if (v.svc === 'need' || v.svc === 'broken') this.openMinigame(i);
          else this.flashTip(INFO[v.type].title, 'Bu makine şu an iyi çalışıyor. ! işareti çıkınca dokun.', MACHINES[v.type].color, 1800);
        }
        if (state.phase === 'build') this.showInfo(v.type);
      }
      return;
    }
    if (!this.drag) return;
    const { type, from, ghost } = this.drag;
    this.drag = null;
    this.tweens.killTweensOf(ghost);
    this.hl.clear();
    this.trashBg.setVisible(false);
    this.trashText.setVisible(false);

    const inTray = p.y > this.trayTop;
    const i = inTray ? -1 : this.cellAt(p.x, this.ghostY(p.y));
    if (i >= 0 && !state.grid[i]) {
      ghost.destroy();
      state.grid[i] = type;
      if (from < 0) state.places--;
      this.spawnCell(i, type, true);
      sfx.place();
    } else if (from >= 0 && (i < 0 || inTray)) {
      // kaldırılan makine hakkı geri verir
      state.places++;
      this.tweens.add({ targets: ghost, scale: 0, angle: 90, alpha: 0, duration: 200, onComplete: () => ghost.destroy() });
      sfx.trash();
    } else if (from >= 0) {
      ghost.destroy();
      state.grid[from] = type;
      this.spawnCell(from, type, false);
      this.cameras.main.shake(80, 0.004);
      sfx.bad();
    } else {
      if (i >= 0) { this.cameras.main.shake(80, 0.004); sfx.bad(); }
      this.tweens.add({ targets: ghost, alpha: 0, scale: 0.5, duration: 150, onComplete: () => ghost.destroy() });
    }
    this.refreshPhase();
  }
}

// ---------- başlat ----------
function boot() {
  const el = document.getElementById('game');
  const size = () => [Math.round(el.clientWidth * D), Math.round(el.clientHeight * D)];
  const [w, h] = size();
  const game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: el,
    backgroundColor: C.bgBot,
    antialias: true,
    scale: { mode: Phaser.Scale.NONE, width: w, height: h, zoom: 1 / D },
    input: { activePointers: 1 },
    scene: [Build],
  });
  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const [nw, nh] = size();
      if (nw !== game.scale.width || nh !== game.scale.height) {
        game.scale.resize(nw, nh);
        game.scale.setZoom(1 / D);
      }
    }, 120);
  });
}
// Yazı tipini bekle (en fazla 1.5 sn), sonra başlat
Promise.race([
  document.fonts ? Promise.all([document.fonts.load('700 20px Fredoka'), document.fonts.load('500 20px Fredoka')]) : Promise.resolve(),
  new Promise(r => setTimeout(r, 1500)),
]).catch(() => {}).then(boot);
</script>
